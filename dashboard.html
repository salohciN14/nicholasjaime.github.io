<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambient Dashboard</title>
<style>
  body {
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .ambient-container {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  #timeDisplay {
    font-size: 5rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #fff;
  }

  #dateDisplay {
    font-size: 0.9rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 0.5rem;
  }

  /* Immersive dark frame for the weather feed */
  .weather-frame {
    border: none;
    border-radius: 8px;
    background: #111;
    overflow: hidden;
    width: 300px;
    height: 70px;
    opacity: 0.75;
    transition: opacity 0.3s;
  }
  
  .weather-frame:hover {
    opacity: 1;
  }

  .back-btn {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-decoration: none;
    color: #333;
    transition: color 0.3s;
  }
  
  .back-btn:hover {
    color: #666;
  }
</style>
</head>
<body>

<div class="ambient-container">
  <div id="timeDisplay">00:00:00</div>
  <div id="dateDisplay">LOADING...</div>
  
  <iframe class="weather-frame" src="https://wttr.in/?format=3&style=dark"></iframe>

  <a href="./" class="back-btn">← RETURN</a>
</div>

<script>
  // ── LIVE CLOCK SYSTEM ───────────────────────────────────
  function updateClock() {
    const now = new Date();
    
    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();
    
    hours = hours < 10 ? '0' + hours : hours;
    minutes = minutes < 10 ? '0' + minutes : minutes;
    seconds = seconds < 10 ? '0' + seconds : seconds;
    
    document.getElementById('timeDisplay').textContent = `${hours}:${minutes}:${seconds}`;

    const options = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
    document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-US', options);
  }
  setInterval(updateClock, 1000);
  updateClock();
</script>

</body>
</html>
