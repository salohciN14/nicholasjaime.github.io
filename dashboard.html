<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambient Command Center</title>
<style>
  body {
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 5rem; 
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    overflow-x: hidden;
    position: relative;
  }

  /* ── FIXED PERIMETER BORDER GLOW ENGINE ── */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 100;
    border: 5px solid transparent;
    border-image: linear-gradient(to right, #4285f4, #9b51e0, #ffffff, #ea4335, #34a853, #fbbc05, #4285f4) 1;
    background-size: 200% auto;
    box-shadow: 
      inset 0 0 8px rgba(255, 255, 255, 0.4),  
      inset 0 0 15px rgba(66, 133, 244, 0.2),  
      inset 0 0 25px rgba(155, 81, 224, 0.15);
    animation: border-flow 8s linear infinite, glow-intensity 4s ease-in-out infinite alternate;
  }

  @keyframes border-flow {
    0% { border-image-source: linear-gradient(to right, #4285f4, #9b51e0, #ffffff, #ea4335, #34a853, #fbbc05, #4285f4); }
    50% { border-image-source: linear-gradient(to bottom, #fbbc05, #4285f4, #9b51e0, #ffffff, #ea4335, #34a853, #fbbc05); }
    100% { border-image-source: linear-gradient(to right, #4285f4, #9b51e0, #ffffff, #ea4335, #34a853, #fbbc05, #4285f4); }
  }

  @keyframes glow-intensity {
    0% {
      box-shadow: 
        inset 0 0 4px rgba(255, 255, 255, 0.2),   
        inset 0 0 12px rgba(66, 133, 244, 0.15),
        inset 0 0 20px rgba(155, 81, 224, 0.1);
    }
    100% {
      box-shadow: 
        inset 0 0 12px rgba(255, 255, 255, 0.55),  
        inset 0 0 18px rgba(66, 133, 244, 0.25),
        inset 0 0 30px rgba(155, 81, 224, 0.2);
    }
  }

  /* ── MAIN MATRIX GRID STRUCTURE ── */
  .matrix-container {
    width: 100%;
    max-width: 75rem;
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
    z-index: 1;
  }

  /* Shared Universal Tile Blueprint */
  .tile-card {
    background: #111;
    border: 1px solid #1c1c1c;
    border-radius: 12px;
    padding: 20px;
    box-sizing: border-box;
  }

  .panel-title {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #444;
    margin-bottom: 1rem;
    border-bottom: 1px solid #1a1a1a;
    padding-bottom: 0.5rem;
  }

  /* ── TOP DECK CONFIGURATION (3 EQUAL TILES) ── */
  .top-deck {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 2.5rem;
  }

  .digital-clock-tile {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 220px;
  }

  #timeDisplay {
    font-size: 5.5rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #fff;
    margin-top: 1rem;
  }

  #dateDisplay {
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #555;
  }

  .analog-clock-tile {
    height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .analog-clock-frame {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 140px;
    width: 100%;
    overflow: hidden;
  }

  .analog-clock-frame iframe {
    transform: scale(0.85); 
  }

  /* Completely Blank Reserved Tile Corner */
  .blank-tile {
    height: 220px;
  }

  /* ── MIDDLE ROW: BALANCE PACED TICKER ── */
  .ticker-wrap {
    width: 100%;
    overflow: hidden;
    height: 38px;
    background-color: #111;
    border: 1px solid #1c1c1c;
    border-radius: 8px;
    display: flex;
    align-items: center;
    box-sizing: border-box;
  }

  .ticker-label {
    background: #ce2c2c; 
    color: #fff;
    padding: 0 15px;
    height: 100%;
    display: flex;
    align-items: center;
    font-size: 0.65rem;
    font-weight: bold;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    z-index: 10;
    box-shadow: 5px 0 15px rgba(0,0,0,0.5);
  }

  .ticker {
    display: inline-block;
    white-space: nowrap;
    padding-right: 100%;
    animation: ticker-move 320s linear infinite;
    color: #e4e4e7;
    font-size: 0.85rem;
    font-weight: 500;
  }

  .ticker:hover { animation-play-state: paused; }

  .ticker-item {
    display: inline-block;
    padding: 0 2rem;
  }
  
  .ticker-item::after {
    content: "///";
    margin-left: 2rem;
    color: #ce2c2c;
  }

  @keyframes ticker-move {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-100%, 0, 0); }
  }

  /* ── MAIN LOWER DECK STRUCTURE ── */
  .main-deck {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
    align-items: flex-start;
  }

  .media-wrapper {
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
  }

  .media-wrapper-container {
    width: 100%;
    height: 352px;
    background: #0d0d0d;
    border-radius: 6px;
    overflow: hidden;
  }

  #yt-player {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* ── SYSTEM NOTEBOOK MODULE ── */
  .scratchpad-box {
    height: 220px;
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
  }

  .scratchpad-header {
    padding: 12px 20px;
    background: #161616;
    border-bottom: 1px solid #1c1c1c;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .scratchpad-nav {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    user-select: none;
  }

  .nav-btn {
    background: transparent;
    border: none;
    color: #666;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.2s, background 0.2s;
  }

  .nav-btn:hover {
    color: #fff;
    background: #222;
  }

  .page-indicator {
    font-size: 0.7rem;
    font-weight: 600;
    color: #444;
    font-variant-numeric: tabular-nums;
  }

  .scratchpad-body {
    flex: 1;
    padding: 20px;
    background: transparent;
    border: none;
    color: #e4e4e7;
    font-family: inherit;
    font-size: 0.9rem;
    resize: none;
    outline: none;
    line-height: 1.5;
  }

  .weather-wrapper {
    min-height: 614px; 
  }

  .back-btn {
    align-self: center;
    margin-top: 1rem;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-decoration: none;
    color: #222;
    transition: color 0.3s;
  }
  .back-btn:hover { color: #555; }

  @media (max-width: 950px) {
    body { padding: 1.5rem; }
    .top-deck { grid-template-columns: 1fr; }
    .main-deck { grid-template-columns: 1fr; }
  }
</style>
</head>

<script>
  function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    let minutes = now.getMinutes();
    
    let displayHours = hours % 12;
    displayHours = displayHours ? displayHours : 12; 
    let displayMinutes = minutes < 10 ? "0" + minutes : minutes;
    
    document.getElementById("timeDisplay").textContent = `${displayHours}:${displayMinutes}`;

    const options = { weekday: "long", month: "short", day: "numeric", year: "numeric" };
    document.getElementById("dateDisplay").textContent = now.toLocaleDateString("en-US", options).toUpperCase();
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>

<script>
  const txtArea = document.getElementById('scratchpadTextArea');
  const indicator = document.getElementById('pageIndicator');
  const prevBtn = document.getElementById('prevPageBtn');
  const nextBtn = document.getElementById('nextPageBtn');
  const addBtn = document.getElementById('addPageBtn');

  let notebookPages = JSON.parse(localStorage.getItem('centerNotebookPages')) || [""];
  let activePageIdx = parseInt(localStorage.getItem('centerActivePageIdx')) || 0;

  if (activePageIdx >= notebookPages.length) activePageIdx = notebookPages.length - 1;
  if (activePageIdx < 0) activePageIdx = 0;

  function renderPage() {
    txtArea.value = notebookPages[activePageIdx];
    indicator.textContent = `${activePageIdx + 1} / ${notebookPages.length}`;
    localStorage.setItem('centerActivePageIdx', activePageIdx);
  }

  txtArea.addEventListener('input', () => {
    notebookPages[activePageIdx] = txtArea.value;
    localStorage.setItem('centerNotebookPages', JSON.stringify(notebookPages));
  });

  addBtn.addEventListener('click', () => {
    notebookPages.push("");
    activePageIdx = notebookPages.length - 1;
    localStorage.setItem('centerNotebookPages', JSON.stringify(notebookPages));
    renderPage();
    txtArea.focus();
  });

  prevBtn.addEventListener('click', () => {
    if (activePageIdx > 0) {
      activePageIdx--;
      renderPage();
    }
  });

  nextBtn.addEventListener('click', () => {
    if (activePageIdx < notebookPages.length - 1) {
      activePageIdx++;
      renderPage();
    }
  });

  renderPage();
</script>
