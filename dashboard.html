<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambient Command Center</title>
<style>
  body {
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    overflow-x: hidden;
    position: relative;
    padding-bottom: 3rem;
  }

  .matrix-container {
    width: 100%;
    max-width: 75rem;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    z-index: 1;
  }

  /* ── TOP ROW: GIANT CLOCKS & EMPTY SPACE ── */
  .top-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
    align-items: center;
  }

  .time-cluster {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .clocks-wrapper {
    display: flex;
    align-items: center;
    gap: 2rem;
    margin-bottom: 0.5rem;
  }
  
  #timeDisplay {
    font-size: 7.5rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #fff;
  }

  .analog-clock-frame {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  
  #dateDisplay {
    font-size: 1rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #444;
    padding-left: 0.25rem;
  }

  .empty-space {
    width: 100%;
    height: 100%;
  }

  /* ── MIDDLE ROW: INLINE NEWS TICKER ── */
  .ticker-wrap {
    width: 100%;
    overflow: hidden;
    height: 38px;
    background-color: #111;
    border: 1px solid #1c1c1c;
    border-radius: 8px;
    display: flex;
    align-items: center;
    box-sizing: border-box;
  }

  .ticker-label {
    background: #303f83;
    color: #fff;
    padding: 0 15px;
    height: 100%;
    display: flex;
    align-items: center;
    font-size: 0.65rem;
    font-weight: bold;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    z-index: 10;
    box-shadow: 5px 0 15px rgba(0,0,0,0.5);
  }

  .ticker {
    display: inline-block;
    white-space: nowrap;
    padding-right: 100%;
    animation: ticker-move 85s linear infinite;
    color: #a1a1aa;
    font-size: 0.85rem;
  }

  .ticker:hover {
    animation-play-state: paused;
  }

  .ticker-item {
    display: inline-block;
    padding: 0 2rem;
  }
  
  .ticker-item::after {
    content: "///";
    margin-left: 2rem;
    color: #303f83;
  }

  @keyframes ticker-move {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-100%, 0, 0); }
  }

  /* ── BOTTOM ROW: MEDIA GRID LAYOUT ── */
  .main-deck {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
    align-items: flex-start;
  }

  @media (max-width: 850px) {
    .top-row { grid-template-columns: 1fr; }
    .main-deck { grid-template-columns: 1fr; }
  }

  .media-wrapper {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1.5rem; /* Pushes crisp breathing space between player and notebook */
  }

  .media-wrapper-container {
    width: 100%;
    height: 352px;
    background: #111;
    border-radius: 12px;
    overflow: hidden;
  }

  #yt-player {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* ── FIXED MULTI-PAGE NOTEBOOK MODULE ── */
  .scratchpad-box {
    width: 100%;
    height: 200px;
    background: #111;
    border: 1px solid #1c1c1c;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-sizing: border-box;
  }

  .scratchpad-header {
    padding: 10px 15px;
    background: #161616;
    border-bottom: 1px solid #1c1c1c;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .scratchpad-title {
    font-size: 0.65rem;
    font-weight: bold;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #444;
  }

  .scratchpad-nav {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    user-select: none;
  }

  .nav-btn {
    background: transparent;
    border: none;
    color: #666;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.2s, background 0.2s;
  }

  .nav-btn:hover {
    color: #fff;
    background: #222;
  }

  .page-indicator {
    font-size: 0.7rem;
    font-weight: 600;
    color: #444;
    font-variant-numeric: tabular-nums;
  }

  .scratchpad-body {
    flex: 1;
    padding: 15px;
    background: transparent;
    border: none;
    color: #e4e4e7;
    font-family: inherit;
    font-size: 0.9rem;
    resize: none;
    outline: none;
    line-height: 1.5;
  }

  /* Right Column Weather */
  .weather-wrapper {
    background: #111;
    border: 1px solid #1c1c1c;
    border-radius: 12px;
    padding: 15px;
    min-height: 352px;
    box-sizing: border-box;
  }

  .panel-title {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #333;
    margin-bottom: 0.75rem;
    border-bottom: 1px solid #111;
    padding-bottom: 0.25rem;
  }

  .back-btn {
    align-self: center;
    margin-top: 1rem;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-decoration: none;
    color: #222;
    transition: color 0.3s;
  }
  .back-btn:hover { color: #555; }
</style>
</head>
<body>

<div class="matrix-container">
  
  <div class="top-row">
    <div class="time-cluster">
      <div class="clocks-wrapper">
        <div id="timeDisplay">12:00:00</div>
        <div class="analog-clock-frame">
          <iframe src="https://free.timeanddate.com/clock/iagc75b3/n810/szw160/szh160/hocfff/hbw2/hfc444/cf100/hnc444/hwc000/faceee/fdi74/mqc000/mql10/mqw4/mqd98/mhc000/mhl10/mhw4/mhd98/mmc000/mml10/mmw1/mmd98/hwm2" frameborder="0" width="160" height="160"></iframe>
        </div>
      </div>
      <div id="dateDisplay">INITIALIZING RUNTIME...</div>
    </div>
    <div class="empty-space"></div>
  </div>

  <div class="ticker-wrap">
    <div class="ticker-label">Live Feed</div>
    <div class="ticker" id="newsTicker">Loading global wire matrix headlines...</div>
  </div>
  
  <div class="main-deck">
    
    <div class="media-wrapper">
      <div>
        <div class="panel-title">Audio Matrix</div>
        <div class="media-wrapper-container">
          <div id="yt-player"></div>
        </div>
      </div>

      <div class="scratchpad-box">
        <div class="scratchpad-header">
          <div class="scratchpad-title">System Notebook</div>
          <div class="scratchpad-nav">
            <button class="nav-btn" id="prevPageBtn">←</button>
            <span class="page-indicator" id="pageIndicator">1 / 1</span>
            <button class="nav-btn" id="nextPageBtn">→</button>
            <button class="nav-btn" id="addPageBtn" style="font-weight:bold; color:#a1a1aa;">+</button>
          </div>
        </div>
        <textarea class="scratchpad-body" id="scratchpadTextArea" placeholder="Type quick logs, URLs, or reminders here..."></textarea>
      </div>
    </div>
    
    <div class="weather-wrapper">
      <div class="panel-title">Atmosphere Engine</div>
      <div class="tomorrow"
         data-location-id=""
         data-language="EN"
         data-unit-system="IMPERIAL"
         data-skin="dark"
         data-widget-type="upcoming"
         style="padding-bottom:22px;position:relative;"
      >
        <a
          href="https://weather.tomorrow.io/"
          rel="nofollow noopener noreferrer"
          target="_blank"
          style="position: absolute; bottom: 0; transform: translateX(-50%); left: 50%;"
        >
          <img
            alt="Powered by Tomorrow.io"
            src="https://weather-website-client.tomorrow.io/img/powered-by.svg"
            width="250"
            height="18"
          />
        </a>
      </div>
    </div>

  </div>

  <a href="./" class="back-btn">← RETURN TO SYSTEM</a>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player;
  
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', {
      height: '100%',
      width: '100%',
      playerVars: { loop: 1 },
      events: { 'onReady': onPlayerReady }
    });
  }

  function onPlayerReady(event) {
    event.target.cuePlaylist({
      listType: 'playlist',
      list: 'PL0stGdZbMNnVqzBLHv4_7_uGbj9lEtnP-'
    });

    setTimeout(function() {
      event.target.setShuffle(true);
    }, 1500);
  }
</script>

<script>
  function updateClock() {
    const now = new Date();
    
    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();
    
    let displayHours = hours % 12;
    displayHours = displayHours ? displayHours : 12; 
    let displayMinutes = minutes < 10 ? "0" + minutes : minutes;
    let displaySeconds = seconds < 10 ? "0" + seconds : seconds;
    document.getElementById("timeDisplay").textContent = `${displayHours}:${displayMinutes}:${displaySeconds}`;

    const options = { weekday: "long", month: "short", day: "numeric", year: "numeric" };
    document.getElementById("dateDisplay").textContent = now.toLocaleDateString("en-US", options).toUpperCase();
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>

<script>
  const txtArea = document.getElementById('scratchpadTextArea');
  const indicator = document.getElementById('pageIndicator');
  const prevBtn = document.getElementById('prevPageBtn');
  const nextBtn = document.getElementById('nextPageBtn');
  const addBtn = document.getElementById('addPageBtn');

  // Load structural array data matrix or set fallback defaults
  let notebookPages = JSON.parse(localStorage.getItem('centerNotebookPages')) || [""];
  let activePageIdx = parseInt(localStorage.getItem('centerActivePageIdx')) || 0;

  // Safety checks to prevent data indexing bounds crashes
  if (activePageIdx >= notebookPages.length) activePageIdx = notebookPages.length - 1;
  if (activePageIdx < 0) activePageIdx = 0;

  function renderPage() {
    txtArea.value = notebookPages[activePageIdx];
    indicator.textContent = `${activePageIdx + 1} / ${notebookPages.length}`;
    localStorage.setItem('centerActivePageIdx', activePageIdx);
  }

  // Active key entry character listener arrays
  txtArea.addEventListener('input', () => {
    notebookPages[activePageIdx] = txtArea.value;
    localStorage.setItem('centerNotebookPages', JSON.stringify(notebookPages));
  });

  // Dynamic initialization array push method
  addBtn.addEventListener('click', () => {
    notebookPages.push("");
    activePageIdx = notebookPages.length - 1;
    localStorage.setItem('centerNotebookPages', JSON.stringify(notebookPages));
    renderPage();
    txtArea.focus();
  });

  prevBtn.addEventListener('click', () => {
    if (activePageIdx > 0) {
      activePageIdx--;
      renderPage();
    }
  });

  nextBtn.addEventListener('click', () => {
    if (activePageIdx < notebookPages.length - 1) {
      activePageIdx++;
      renderPage();
    }
  });

  // Execute base render loop on load
  renderPage();
</script>

<script>
  async function fetchNews() {
    const tickerContainer = document.getElementById('newsTicker');
    try {
      const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Ffeeds.bbci.co.uk%2Fnews%2Frss.xml');
      const data = await response.json();
      
      if(data.status === 'ok' && data.items.length > 0) {
        let tickerHTML = '';
        data.items.forEach(item => {
          tickerHTML += `<span class="ticker-item">${item.title}</span>`;
        });
        tickerContainer.innerHTML = tickerHTML + tickerHTML;
      } else {
        tickerContainer.innerHTML = '<span class="ticker-item">Wire connection active. Awaiting fresh data updates...</span>';
      }
    } catch (error) {
      tickerContainer.innerHTML = '<span class="ticker-item">Error reading wire matrix headlines. Retrying connection...</span>';
    }
  }
  fetchNews();
  setInterval(fetchNews, 600000); 
</script>

<script>
(function(d, s, id) {
    if (d.getElementById(id)) {
        if (window.__TOMORROW__) {
            window.__TOMORROW__.renderWidget();
        }
        return;
    }
    const fjs = d.getElementsByTagName(s)[0];
    const js = d.createElement(s);
    js.id = id;
    js.src = "https://www.tomorrow.io/v1/widget/sdk/sdk.bundle.min.js";

    fjs.parentNode.insertBefore(js, fjs);
})(document, 'script', 'tomorrow-sdk');
</script>

</body>
</html>
