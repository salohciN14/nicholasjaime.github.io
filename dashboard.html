<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Station — Atmosphere</title>
<style>
  html, body {
    background: #0a0a0a;
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
  }

  /* Full-bleed layout setup for Tomorrow.io frame grid */
  .tomorrow {
    width: 100% !important;
    min-height: 100vh !important;
    box-sizing: border-box;
    padding: 2rem !important;
  }

  /* Discretely float your return button in the bottom corner so you aren't trapped */
  .back-btn {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-decoration: none;
    color: #333;
    background: rgba(10, 10, 10, 0.8);
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid #1c1c1c;
    z-index: 999999;
    transition: color 0.3s, border-color 0.3s;
  }
  .back-btn:hover { 
    color: #666;
    border-color: #333;
  }
</style>
</head>
<body>

  <div class="tomorrow"
     data-location-id=""
     data-language="EN"
     data-unit-system="IMPERIAL"
     data-skin="dark"
     data-widget-type="upcoming"
     style="padding-bottom:22px;position:relative;"
  >
    <a
      href="https://weather.tomorrow.io/"
      rel="nofollow noopener noreferrer"
      target="_blank"
      style="position: absolute; bottom: 0; transform: translateX(-50%); left: 50%;"
    >
      <img
        alt="Powered by Tomorrow.io"
        src="https://weather-website-client.tomorrow.io/img/powered-by.svg"
        width="250"
        height="18"
      />
    </a>
  </div>

  <a href="./" class="back-btn">← RETURN</a>

  <script>
  (function(d, s, id) {
      if (d.getElementById(id)) {
          if (window.__TOMORROW__) {
              window.__TOMORROW__.renderWidget();
          }
          return;
      }
      const fjs = d.getElementsByTagName(s)[0];
      const js = d.createElement(s);
      js.id = id;
      js.src = "https://www.tomorrow.io/v1/widget/sdk/sdk.bundle.min.js";

      fjs.parentNode.insertBefore(js, fjs);
  })(document, 'script', 'tomorrow-sdk');
  </script>

</body>
</html>
