<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambient Command Center</title>
<style>
  body {
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
  }

  .matrix-container {
    width: 100%;
    max-width: 75rem;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 3rem;
  }

  /* ── TOP SECTION: CENTERED TIME & DATE ── */
  .clock-box {
    text-align: center;
    width: 100%;
  }
  
  #timeDisplay {
    font-size: 6rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #fff;
    margin-bottom: 0.5rem;
  }
  
  #dateDisplay {
    font-size: 0.95rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #444;
  }

  /* ── MAIN DECK: SIDE-BY-SIDE SPLIT ── */
  .main-deck {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
    align-items: stretch;
  }

  @media (max-width: 850px) {
    .main-deck { grid-template-columns: 1fr; }
  }

  /* Left Side: Solid Control Link Hub */
  .spotify-wrapper {
    background: #111;
    border: 1px solid #1c1c1c;
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-sizing: border-box;
    min-height: 320px;
  }

  .launch-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    background: #141414;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 2.5rem 1rem;
    text-decoration: none;
    color: #1DB954;
    font-weight: bold;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-size: 0.9rem;
    transition: all 0.3s ease;
    flex-grow: 1;
    margin-top: 1rem;
  }

  .launch-btn:hover {
    background: #1ed760;
    color: #000;
    border-color: #1ed760;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(29, 185, 84, 0.15);
  }

  .launch-btn span {
    font-size: 2.5rem;
  }

  /* Right Side: Weather Bracket */
  .weather-wrapper {
    background: #111;
    border: 1px solid #1c1c1c;
    border-radius: 12px;
    padding: 15px;
    min-height: 320px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }

  .weather-wrapper .tomorrow {
    flex-grow: 1;
  }

  .panel-title {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #333;
    margin-bottom: 0.75rem;
    border-bottom: 1px solid #111;
    padding-bottom: 0.25rem;
  }

  .back-btn {
    align-self: center;
    margin-top: 1rem;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-decoration: none;
    color: #222;
    transition: color 0.3s;
  }
  .back-btn:hover { color: #555; }
</style>
</head>
<body>

<div class="matrix-container">
  
  <header class="clock-box">
    <div id="timeDisplay">12:00:00</div>
    <div id="dateDisplay">INITIALIZING RUNTIME...</div>
  </header>
  
  <div class="main-deck">
    
    <div class="spotify-wrapper">
      <div class="panel-title">Audio Matrix</div>
      <a href="https://open.spotify.com/playlist/2gG2yK0gLg7HwE1V6M7S0F" target="_blank" class="launch-btn">
        <span>🎵</span>
        Open Your Playlist
      </a>
    </div>
    
    <div class="weather-wrapper">
      <div class="panel-title">Atmosphere Engine</div>
      <div class="tomorrow"
         data-location-id=""
         data-language="EN"
         data-unit-system="IMPERIAL"
         data-skin="dark"
         data-widget-type="upcoming"
         style="padding-bottom:22px;position:relative;"
      >
        <a
          href="https://weather.tomorrow.io/"
          rel="nofollow noopener noreferrer"
          target="_blank"
          style="position: absolute; bottom: 0; transform: translateX(-50%); left: 50%;"
        >
          <img
            alt="Powered by Tomorrow.io"
            src="https://weather-website-client.tomorrow.io/img/powered-by.svg"
            width="250"
            height="18"
          />
        </a>
      </div>
    </div>

  </div>

  <a href="./" class="back-btn">← RETURN TO SYSTEM</a>

</div>

<script>
(function(d, s, id) {
    if (d.getElementById(id)) {
        if (window.__TOMORROW__) {
            window.__TOMORROW__.renderWidget();
        }
        return;
    }
    const fjs = d.getElementsByTagName(s)[0];
    const js = d.createElement(s);
    js.id = id;
    js.src = "https://www.tomorrow.io/v1/widget/sdk/sdk.bundle.min.js";

    fjs.parentNode.insertBefore(js, fjs);
})(document, 'script', 'tomorrow-sdk');
</script>
