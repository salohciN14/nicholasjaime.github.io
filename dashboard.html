<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Station — Atmosphere</title>
<style>
  body {
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .station-container {
    width: 100%;
    max-width: 50rem;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 3rem;
    align-items: center;
    box-sizing: border-box;
  }

  .station-header {
    text-align: center;
    width: 100%;
  }
  
  #timeDisplay {
    font-size: 5rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #fff;
    margin-bottom: 0.5rem;
  }
  
  #dateDisplay {
    font-size: 0.85rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #444;
  }

  /* Sleek layout frame holding your custom widget */
  .widget-wrapper {
    width: 100%;
    min-height: 150px;
    background: #111;
    border: 1px solid #1c1c1c;
    border-radius: 8px;
    padding: 4px;
    box-sizing: border-box;
  }

  .back-btn {
    margin-top: 1rem;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-decoration: none;
    color: #333;
    transition: color 0.3s;
  }
  .back-btn:hover { color: #666; }
</style>
</head>
<body>

<div class="station-container">
  
  <header class="station-header">
    <div id="timeDisplay">12:00:00</div>
    <div id="dateDisplay">LOADING RUNTIME...</div>
  </header>

  <div class="widget-wrapper">
    <a class="weatherwidget-io" href="https://forecast7.com/en/39d64n84d29/miamisburg/?unit=us" data-label_1="MIAMISBURG" data-label_2="WEATHER" data-font="Arial Black" data-icons="Climacons Animated" data-theme="dark" >MIAMISBURG WEATHER</a>
  </div>

  <a href="./" class="back-btn">← RETURN TO SYSTEM</a>

</div>

<script>
  // ── LIVE RUNTIME CLOCK SYSTEM ───────────────────────────
  function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();
    
    // Convert to standard 12-hour format
    hours = hours % 12;
    hours = hours ? hours : 12; 
    
    minutes = minutes < 10 ? "0" + minutes : minutes;
    seconds = seconds < 10 ? "0" + seconds : seconds;
    
    document.getElementById("timeDisplay").textContent = `${hours}:${minutes}:${seconds}`;

    const options = { weekday: "long", month: "short", day: "numeric", year: "numeric" };
    document.getElementById("dateDisplay").textContent = now.toLocaleDateString("en-US", options).toUpperCase();
  }
  
  // Start clock immediately
  updateClock();
  setInterval(updateClock, 1000);

  // ── YOUR WIDGET SCRIPT ENGINE (Safely Loaded Last) ──────
  !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
</script>

</body>
</html>
