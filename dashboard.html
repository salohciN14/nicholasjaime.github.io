<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambient Command Center</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; 
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    padding: 2.5rem; 
    position: relative;
  }

  /* ── THINNER PERIMETER BORDER GLOW ENGINE ── */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 100;
    border: 2px solid transparent; 
    border-image: linear-gradient(to right, #4285f4, #9b51e0, #ffffff, #ea4335, #34a853, #fbbc05, #4285f4) 1;
    background-size: 200% auto;
    box-shadow: 
      inset 0 0 4px rgba(255, 255, 255, 0.3),  
      inset 0 0 10px rgba(66, 133, 244, 0.15);
    animation: border-flow 8s linear infinite, glow-intensity 4s ease-in-out infinite alternate;
  }

  @keyframes border-flow {
    0% { border-image-source: linear-gradient(to right, #4285f4, #9b51e0, #ffffff, #ea4335, #34a853, #fbbc05, #4285f4); }
    50% { border-image-source: linear-gradient(to bottom, #fbbc05, #4285f4, #9b51e0, #ffffff, #ea4335, #34a853, #fbbc05); }
    100% { border-image-source: linear-gradient(to right, #4285f4, #9b51e0, #ffffff, #ea4335, #34a853, #fbbc05, #4285f4); }
  }

  @keyframes glow-intensity {
    0% { box-shadow: inset 0 0 4px rgba(255, 255, 255, 0.2), inset 0 0 10px rgba(66, 133, 244, 0.1); }
    100% { box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.4), inset 0 0 15px rgba(66, 133, 244, 0.2); }
  }

  /* ── MAIN GRID MATRIX CONTAINER ── */
  .matrix-container {
    width: 100%;
    max-width: 80rem; 
    display: flex;
    flex-direction: column;
    gap: 1.5rem; 
    z-index: 1;
    box-sizing: border-box;
  }

  /* Universal Transparent/Borderless Card Style */
  .tile-card {
    background: transparent;
    border: none;
    padding: 0.5rem;
    box-sizing: border-box;
  }

  /* ── TOP DECK CONFIGURATION (3 EQUAL TILES) ── */
  .top-deck {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1.5rem;
    height: 140px; 
    align-items: center;
  }

  .digital-clock-tile {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start; /* Aligned left like your drawing */
    text-align: left;
  }

  #timeDisplay {
    font-size: 4rem; 
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #fff;
    margin-bottom: 0.4rem;
  }

  #dateDisplay {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #666;
  }

  .analog-clock-tile {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .analog-clock-frame {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  .analog-clock-frame iframe {
    transform: scale(0.85); 
  }

  .blank-tile {
    /* Intentionally completely blank spacer element */
  }

  /* ── MIDDLE ROW: TEXT TICKER BAR ── */
  .ticker-wrap {
    width: 100%;
    overflow: hidden;
    height: 36px; 
    background-color: transparent;
    border-bottom: 1px solid #1a1a1a; /* Subtle separator line */
    display: flex;
    align-items: center;
    box-sizing: border-box;
  }

  .ticker-label {
    background: #ce2c2c; 
    color: #fff;
    padding: 0 12px;
    height: 24px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    font-size: 0.6rem;
    font-weight: bold;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    z-index: 10;
  }

  .ticker {
    display: inline-block;
    white-space: nowrap;
    padding-right: 100%;
    animation: ticker-move 320s linear infinite;
    color: #a1a1aa;
    font-size: 0.75rem;
    font-weight: 500;
  }

  .ticker:hover { animation-play-state: paused; }

  .ticker-item {
    display: inline-block;
    padding: 0 1.5rem;
  }
  
  .ticker-item::after {
    content: "///";
    margin-left: 1.5rem;
    color: #ce2c2c;
  }

  @keyframes ticker-move {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-100%, 0, 0); }
  }

  /* ── MAIN LOWER DECK STRUCTURE (3-COLUMN ACCURATE GRID) ── */
  .main-deck {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr; /* Exact layout distribution from your sketch */
    gap: 1.5rem;
    align-items: start;
    height: 380px;
  }

  .media-wrapper-container {
    width: 100%;
    height: 100%; 
    background: #0d0d0d;
    border-radius: 12px;
    overflow: hidden;
  }

  #yt-player {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* ── SYSTEM NOTEBOOK MODULE ── */
  .scratchpad-box {
    height: 100%; 
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
    background: #111;
    border-radius: 12px;
  }

  .scratchpad-header {
    padding: 12px 16px;
    background: #161616;
    border-bottom: 1px solid #1c1c1c;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .scratchpad-nav {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    user-select: none;
  }

  .nav-btn {
    background: transparent;
    border: none;
    color: #666;
    font-size: 0.8rem;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    transition: color 0.2s, background 0.2s;
  }

  .nav-btn:hover {
    color: #fff;
    background: #222;
  }

  .page-indicator {
    font-size: 0.65rem;
    font-weight: 600;
    color: #444;
    font-variant-numeric: tabular-nums;
  }

  .scratchpad-body {
    flex: 1;
    padding: 14px 16px;
    background: transparent;
    border: none;
    color: #e4e4e7;
    font-family: inherit;
    font-size: 0.85rem;
    resize: none;
    outline: none;
    line-height: 1.5;
  }

  /* ── WEATHER CONTAINER ── */
  .weather-wrapper {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  @media (max-width: 950px) {
    html, body { overflow: auto; height: auto; }
    body { padding: 1rem; }
    .top-deck { grid-template-columns: 1fr; height: auto; }
    .main-deck { grid-template-columns: 1fr; height: auto; }
    .digital-clock-tile { align-items: center; text-align: center; }
  }
</style>
</head>
<body>

<div class="matrix-container">
  
  <div class="top-deck">
    <div class="tile-card digital-clock-tile">
      <div id="timeDisplay">12:00</div>
      <div id="dateDisplay">INITIALIZING...</div>
    </div>

    <div class="tile-card analog-clock-tile">
      <div class="analog-clock-frame">
        <iframe src="https://free.timeanddate.com/clock/iagc75b3/n810/szw160/szh160/hocfff/hbw2/hfc444/cf100/hnc444/hwc000/faceee/fdi74/mqc000/mql10/mqw4/mqd98/mhc000/mhl10/mhw4/mhd98/mmc000/mml10/mmw1/mmd98/hwm2" frameborder="0" width="160" height="160"></iframe>
      </div>
    </div>

    <div class="tile-card blank-tile"></div>
  </div>

  <div class="ticker-wrap">
    <div class="ticker-label">BREAKING NEWS</div>
    <div class="ticker" id="newsTicker">Loading clicker subroutines...</div>
  </div>
  
  <div class="main-deck">
    
    <div class="tile-card">
      <div class="media-wrapper-container">
        <div id="yt-player"></div>
      </div>
    </div>

    <div class="scratchpad-box">
      <div class="scratchpad-header">
        <div class="scratchpad-title" style="font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: #555; font-weight: bold;">System Notebook</div>
        <div class="scratchpad-nav">
          <button class="nav-btn" id="prevPageBtn">←</button>
          <span class="page-indicator" id="pageIndicator">1 / 1</span>
          <button class="nav-btn" id="nextPageBtn">→</button>
          <button class="nav-btn" id="addPageBtn" style="font-weight:bold; color:#a1a1aa;">+</button>
        </div>
      </div>
      <textarea class="scratchpad-body" id="scratchpadTextArea" placeholder="Type quick logs, URLs, or reminders here..."></textarea>
    </div>
    
    <div class="tile-card weather-wrapper">
      <div class="tomorrow"
         data-location-id="064504"
         data-language="EN"
         data-unit-system="IMPERIAL"
         data-skin="dark"
         data-widget-type="upcoming"
         style="padding-bottom:22px;position:relative;flex:1;"
      >
        <a
          href="https://weather.tomorrow.io/"
          rel="nofollow noopener noreferrer"
          target="_blank"
          style="position: absolute; bottom: 0; transform: translateX(-50%); left: 50%;"
        >
          <img
            alt="Powered by Tomorrow.io"
            src="https://weather-website-client.tomorrow.io/img/powered-by.svg"
            width="250"
            height="18"
          />
        </a>
      </div>
    </div>

  </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player;
  
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', {
      height: '100%',
      width: '100%',
      playerVars: { loop: 1 },
      events: { 'onReady': onPlayerReady }
    });
  }

  function onPlayerReady(event) {
    event.target.cuePlaylist({
      listType: 'playlist',
      list: 'PL0stGdZbMNnVqzBLHv4_7_uGbj9lEtnP-'
    });

    setTimeout(function() {
      event.target.setShuffle(true);
    }, 1500);
  }
</script>

<script>
  function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    let minutes = now.getMinutes();
    
    let displayHours = hours % 12;
    displayHours = displayHours ? displayHours : 12; 
    let displayMinutes = minutes < 10 ? "0" + minutes : minutes;
    
    document.getElementById("timeDisplay").textContent = `${displayHours}:${displayMinutes}`;

    const options = { weekday: "long", month: "short", day: "numeric", year: "numeric" };
    document.getElementById("dateDisplay").textContent = now.toLocaleDateString("en-US", options).toUpperCase();
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>

<script>
  const txtArea = document.getElementById('scratchpadTextArea');
  const indicator = document.getElementById('pageIndicator');
  const prevBtn = document.getElementById('prevPageBtn');
  const nextBtn = document.getElementById('nextPageBtn');
  const addBtn = document.getElementById('addPageBtn');

  let notebookPages = JSON.parse(localStorage.getItem('centerNotebookPages')) || [""];
  let activePageIdx = parseInt(localStorage.getItem('centerActivePageIdx')) || 0;

  if (activePageIdx >= notebookPages.length) activePageIdx = notebookPages.length - 1;
  if (activePageIdx < 0) activePageIdx = 0;

  function renderPage() {
    txtArea.value = notebookPages[activePageIdx];
    indicator.textContent = `${activePageIdx + 1} / ${notebookPages.length}`;
    localStorage.setItem('centerActivePageIdx', activePageIdx);
  }

  txtArea.addEventListener('input', () => {
    notebookPages[activePageIdx] = txtArea.value;
    localStorage.setItem('centerNotebookPages', JSON.stringify(notebookPages));
  });

  addBtn.addEventListener('click', () => {
    notebookPages.push("");
    activePageIdx = notebookPages.length - 1;
    localStorage.setItem('centerNotebookPages', JSON.stringify(notebookPages));
    renderPage();
    txtArea.focus();
  });

  prevBtn.addEventListener('click', () => {
    if (activePageIdx > 0) {
      activePageIdx--;
      renderPage();
    }
  });

  nextBtn.addEventListener('click', () => {
    if (activePageIdx < notebookPages.length - 1) {
      activePageIdx++;
      renderPage();
    }
  });

  renderPage();
</script>

<script>
(function(d, s, id) {
    if (d.getElementById(id)) {
        if (window.__TOMORROW__) {
