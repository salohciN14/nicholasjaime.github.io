<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambient Dashboard</title>
<style>
  body {
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .ambient-container {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  #timeDisplay {
    font-size: 5rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #fff;
  }

  #dateDisplay {
    font-size: 0.9rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 0.5rem;
  }

  #weatherDisplay {
    font-family: monospace;
    font-size: 1rem;
    letter-spacing: 0.05em;
    color: #888;
    text-transform: uppercase;
    max-width: 400px;
    line-height: 1.4;
  }

  .back-btn {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-decoration: none;
    color: #333;
    transition: color 0.3s;
  }
  
  .back-btn:hover {
    color: #666;
  }
</style>
</head>
<body>

<div class="ambient-container">
  <div id="timeDisplay">00:00:00</div>
  <div id="dateDisplay">LOADING...</div>
  
  <div id="weatherDisplay">FETCHING ATMOSPHERE...</div>

  <a href="./" class="back-btn">← RETURN</a>
</div>

<script>
  // ── LIVE CLOCK SYSTEM ───────────────────────────────────
  function updateClock() {
    const now = new Date();
    
    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();
    
    hours = hours < 10 ? '0' + hours : hours;
    minutes = minutes < 10 ? '0' + minutes : minutes;
    seconds = seconds < 10 ? '0' + seconds : seconds;
    
    document.getElementById('timeDisplay').textContent = `${hours}:${minutes}:${seconds}`;

    const options = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
    document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-US', options);
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── NATIONAL WEATHER SERVICE SYSTEM (OHIO LOCAL) ────────
  async function fetchWeather() {
    try {
      // Fetching the official public weather station feed for the ILN zone (Southwest Ohio)
      const response = await fetch('https://api.weather.gov/gridpoints/ILN/37,41/forecast/hourly');
      if (response.ok) {
        const data = await response.json();
        // Grabs the absolute latest hourly update
        const currentPeriod = data.properties.periods[0];
        
        const temp = currentPeriod.temperature;
        const condition = currentPeriod.shortForecast;
        
        // Formats beautifully as: "PARTLY CLOUDY • 81°F"
        document.getElementById('weatherDisplay').textContent = `${condition} • ${temp}°F`;
      } else {
        document.getElementById('weatherDisplay').textContent = "WEATHER UNAVAILABLE";
      }
    } catch (error) {
      document.getElementById('weatherDisplay').textContent = "OFFLINE";
    }
  }
  fetchWeather();
  setInterval(fetchWeather, 900000); // Update every 15 minutes
</script>

</body>
</html>
