<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambient Command Center</title>
<style>
  body {
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
  }

  .matrix-container {
    width: 100%;
    max-width: 75rem;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 3rem;
  }

  /* ── TOP SECTION: CENTERED TIME & DATE ── */
  .clock-box {
    text-align: center;
    width: 100%;
  }
  
  #timeDisplay {
    font-size: 6rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #fff;
    margin-bottom: 0.5rem;
  }
  
  #dateDisplay {
    font-size: 0.95rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #444;
  }

  /* ── MAIN DECK: SIDE-BY-SIDE SPLIT ── */
  .main-deck {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
    align-items: flex-start;
  }

  @media (max-width: 850px) {
    .main-deck { grid-template-columns: 1fr; }
  }

  /* Left Side: Spotify Bracket */
  .spotify-wrapper {
    width: 100%;
  }

  .spotify-wrapper iframe {
    width: 100%;
    height: 352px;
    border: none;
    border-radius: 12px;
    background: #181818; /* Visual fallback color while loading */
  }

  /* Right Side: Weather Bracket */
  .weather-wrapper {
    background: #111;
    border: 1px solid #1c1c1c;
    border-radius: 12px;
    padding: 15px;
    min-height: 320px;
    box-sizing: border-box;
  }

  .panel-title {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #333;
    margin-bottom: 0.75rem;
    border-bottom: 1px solid #111;
    padding-bottom: 0.25rem;
  }

  .back-btn {
    align-self: center;
    margin-top: 1rem;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-decoration: none;
    color: #222;
