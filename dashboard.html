<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambient Command Center</title>
<style>
  body {
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 5rem; 
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    overflow-x: hidden;
    position: relative;
  }

  /* ── TRUE GEMINI INFINITY GLOW ENGINE ── */
  .gemini-glow-container {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }

  /* Layer 1: The Perimeter Rainbow Loop
     Spins continuously to move the color spectrum around the edges */
  .gemini-glow-container::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(
      from 0deg,
      #4285f4 0deg,
      #9b51e0 60deg,
      #ea4335 120deg,
      #34a853 180deg,
      #fbbc05 240deg,
      #4285f4 300deg,
      #9b51e0 360deg
    );
    animation: spin-around 14s linear infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    padding: 5px; 
  }

  /* Layer 2: Varying Intensities & White Ambient Bleed
     Handles the deep, soft light bleeding far into the website area */
  .gemini-glow-container::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    box-shadow: 
      inset 0 0 50px rgba(255, 255, 255, 0.15),
      inset 30px -40px 100px rgba(66, 133, 244, 0.2),
      inset -50px 20px 120px rgba(155, 81, 224, 0.15),
      inset 20px 60px 110px rgba(234, 67, 53, 0.15);
    animation: intensity-wave 10s ease-in-out infinite alternate;
  }

  /* Layer 3: High-Intensity Dynamic White Surges
     Specifically targets those intense bursts of white that swell up, 
     fade down, and travel independently around the perimeter */
  .gemini-white-surges {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    pointer-events: none;
    background: conic-gradient(
      from 180deg,
      transparent 0deg,
      rgba(255, 255, 255, 0) 100deg,
      rgba(255, 255, 255, 0.8) 140deg, /* Hyper-intense white focal point */
      rgba(255, 255, 255, 1) 150deg,
      rgba(255, 255, 255, 0.8) 160deg,
      transparent 200deg,
      rgba(255, 255, 255, 0) 280deg,
      rgba(255, 255, 255, 0.5) 320deg, /* Secondary medium white point */
      transparent 360deg
    );
    /* Blurs the white light heavily so it bleeds away from the edge into the site */
    filter: blur(40px); 
    mix-blend-mode: screen;
    animation: spin-around 8s linear infinite reverse, white-pulse 6s ease-in-out infinite alternate;
    opacity: 0.6;
  }

  /* Spinning animation driving perimeter travel */
  @keyframes spin-around {
    100% { transform: rotate(360deg); }
  }

  /* Controls the undulating, fluid swelling of the intense white beams */
  @keyframes white-pulse {
    0% {
      opacity: 0.4;
      transform: scale(0.95) rotate(0deg);
    }
    50% {
      opacity: 0.85;
      transform: scale(1.05) rotate(180deg);
    }
    100% {
      opacity: 0.5;
      transform: scale(0.9) rotate(360deg);
    }
  }

  /* Fluctuation wave for atmospheric background shadows */
  @keyframes intensity-wave {
    0% {
      filter: blur(4px) contrast(1);
      box-shadow: 
        inset 0 0 80px rgba(255, 255, 255, 0.35), /* Massive white bleed */
        inset -30px 50px 130px rgba(66, 133, 244, 0.25),
        inset 60px -30px 90px rgba(155, 81, 224, 0.1),
        inset -20px -50px 140px rgba(234, 67, 53, 0.2);
    }
    100% {
      filter: blur(8px) contrast(1.1);
      box-shadow: 
        inset 0 0 40px rgba(255, 255, 255, 0.1),
        inset 50px -20px 90px rgba(66, 133, 244, 0.15),
        inset -40px 60px 140px rgba(155, 81, 224, 0.3),
        inset 30px 40px 90px rgba(234, 67, 53, 0.05);
    }
  }

  .matrix-container {
    width: 100%;
    max-width: 75rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    z-index: 1;
  }

  /* ── TOP ROW: INSIDE SHIFTED TIME MODULE ── */
  .top-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
    align-items: center;
  }

  .time-cluster {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding-left: 1.5rem; 
  }

  .clocks-wrapper {
    display: flex;
    align-items: center;
    gap: 2rem;
    margin-bottom: 0.5rem;
  }
  
  #timeDisplay {
    font-size: 7.5rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #fff;
  }

  .analog-clock-frame {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  
  #dateDisplay {
    font-size: 1rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #444;
    padding-left: 0.25rem;
  }

  .empty-space {
    width: 100%;
    height: 100%;
  }

  /* ── MIDDLE ROW: RE-ACCELERATED TICKER ── */
  .ticker-wrap {
    width: 100%;
    overflow: hidden;
    height: 38px;
    background-color: #111;
    border: 1px solid #1c1c1c;
    border-radius: 8px;
    display: flex;
    align-items: center;
    box-sizing: border-box;
  }

  .ticker-label {
    background: #ce2c2c; 
    color: #fff;
    padding: 0 15px;
    height: 100%;
    display: flex;
    align-items: center;
    font-size: 0.65rem;
    font-weight: bold;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    z-index: 10;
    box-shadow: 5px 0 15px rgba(0,0,0,0.5);
  }

  .ticker {
    display: inline-block;
    white-space: nowrap;
    padding-right: 100%;
    animation: ticker-move 320s linear infinite;
    color: #e4e4e7;
    font-size: 0.85rem;
    font-weight: 500;
  }

  .ticker:hover {
    animation-play-state: paused;
  }

  .ticker-item {
    display: inline-block;
    padding: 0 2rem;
  }
  
  .ticker-item::after {
    content: "///";
    margin-left: 2rem;
    color: #ce2c2c;
  }

  @keyframes ticker-move {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-100%, 0, 0); }
  }

  /* ── BOTTOM ROW: MEDIA GRID LAYOUT ── */
  .main-deck {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
    align-items: flex-start;
  }

  @media (max-width: 850px) {
    body { padding: 1.5rem; }
    .top-row { grid-template-columns: 1fr; }
    .main-deck { grid-template-columns: 1fr; }
  }

  .media-wrapper {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .media-wrapper-container {
    width: 100%;
    height: 352px;
    background: #111;
    border-radius: 12px;
    overflow: hidden;
  }

  #yt-player {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* ── SYSTEM NOTEBOOK MODULE ── */
  .scratchpad-box {
    width: 100%;
    height: 200px;
    background: #111;
    border: 1px solid #1c1c1c;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-sizing: border-box;
  }

  .scratchpad-header {
    padding: 10px 15px;
    background: #161616;
    border-bottom: 1px solid #1c1c1c;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .scratchpad-title {
    font-size: 0.65rem;
    font-weight: bold;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #444;
  }

  .scratchpad-nav {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    user-select: none;
  }

  .nav-btn {
    background: transparent;
    border: none;
    color: #666;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.2s, background 0.2s;
  }

  .nav-btn:hover {
    color: #fff;
    background: #222;
  }

  .page-indicator {
    font-size: 0.7rem;
    font-weight: 600;
    color: #444;
    font-variant-numeric: tabular-nums;
  }

  .scratchpad-body {
    flex: 1;
    padding: 15px;
    background: transparent;
    border: none;
    color: #e4e4e7;
    font-family: inherit;
    font-size: 0.9rem;
    resize: none;
    outline: none;
    line-height: 1.5;
  }

  /* Right Column Weather */
  .weather-wrapper {
    background: #111;
    border: 1px solid #1c1c1c;
    border-radius: 12px;
    padding: 15px;
    min-height: 352px;
    box-sizing: border-box;
  }

  .panel-title {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #333;
    margin-bottom: 0.75rem;
    border-bottom: 1px solid #111;
    padding-bottom: 0.25rem;
  }

  .back-btn {
    align-self: center;
    margin-top: 1rem;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-decoration: none;
    color: #222;
    transition: color 0.3s;
  }
  .back-btn:hover { color: #555; }
</style>
</head>
<body>

<div class="gemini-glow-container">
  <div class="gemini-white-surges"></div>
</div>

<div class="matrix-container">
  
  <div class="top-row">
    <div class="time-cluster">
      <div class="clocks-wrapper">
        <div id="timeDisplay">12:00</div>
        <div class="analog-clock-frame">

  <div class="ticker-wrap">

  </div>
  
  <div class="main-deck">
    
    <div class="media-wrapper">
      <div>
        <div class="panel-title">Audio Matrix</div>

          <div id="yt-player"></div>

      </div>

      <div class="scratchpad-box">

            <span class="page-indicator" id="pageIndicator">1 / 1</span>

    <div class="weather-wrapper">
      <div class="panel-title">Atmosphere Engine</div>
      <div class="tomorrow"

         data-unit-system="IMPERIAL"
         data-skin="dark"
         data-widget-type="upcoming"
         style="padding-bottom:22px;position:relative;"
      >
        <a
          href="https://weather.tomorrow.io/"
          rel="nofollow noopener noreferrer"
          target="_blank"
          style="position: absolute; bottom: 0; transform: translateX(-50%); left: 50%;"
        >
          <img
            alt="Powered by Tomorrow.io"
            src="https://weather-website-client.tomorrow.io/img/powered-by.svg"
            width="250"
            height="18"
          />
        </a>
      </div>
    </div>

  </div>

  <a href="./" class="back-btn">← RETURN TO SYSTEM</a>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player;
  
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', {
      height: '100%',
      width: '100%',
      playerVars: { loop: 1 },
      events: { 'onReady': onPlayerReady }
    });
  }

  function onPlayerReady(event) {
    event.target.cuePlaylist({
      listType: 'playlist',
      list: 'PL0stGdZbMNnVqzBLHv4_7_uGbj9lEtnP-'
    });

    setTimeout(function() {
      event.target.setShuffle(true);
    }, 1500);
  }
</script>

<script>
  function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    let minutes = now.getMinutes();
    
    let displayHours = hours % 12;
    displayHours = displayHours ? displayHours : 12; 
    let displayMinutes = minutes < 10 ? "0" + minutes : minutes;
    
    document.getElementById("timeDisplay").textContent = `${displayHours}:${displayMinutes}`;

    const options = { weekday: "long", month: "short", day: "numeric", year: "numeric" };
    document.getElementById("dateDisplay").textContent = now.toLocaleDateString("en-US", options).toUpperCase();
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>

<script>
  const txtArea = document.getElementById('scratchpadTextArea');
  const indicator = document.getElementById('pageIndicator');
  const prevBtn = document.getElementById('prevPageBtn');
  const nextBtn = document.getElementById('nextPageBtn');
  const addBtn = document.getElementById('addPageBtn');

  let notebookPages = JSON.parse(localStorage.getItem('centerNotebookPages')) || [""];
  let activePageIdx = parseInt(localStorage.getItem('centerActivePageIdx')) || 0;

  if (activePageIdx >= notebookPages.length) activePageIdx = notebookPages.length - 1;
  if (activePageIdx < 0) activePageIdx = 0;

  function renderPage() {
    txtArea.value = notebookPages[activePageIdx];
    indicator.textContent = `${activePageIdx + 1} / ${notebookPages.length}`;
    localStorage.setItem('centerActivePageIdx', activePageIdx);
  }

  txtArea.addEventListener('input', () => {
    notebookPages[activePageIdx] = txtArea.value;
    localStorage.setItem('centerNotebookPages', JSON.stringify(notebookPages));
  });

  addBtn.addEventListener('click', () => {
    notebookPages.push("");
    activePageIdx = notebookPages.length - 1;
    localStorage.setItem('centerNotebookPages', JSON.stringify(notebookPages));
    renderPage();
    txtArea.focus();
  });

  prevBtn.addEventListener('click', () => {
    if (activePageIdx > 0) {
      activePageIdx--;
      renderPage();
    }
  });

  nextBtn.addEventListener('click', () => {
    if (activePageIdx < notebookPages.length - 1) {
      activePageIdx++;
      renderPage();
    }
  });

  renderPage();
</script>
