<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Station — Atmosphere</title>
<style>
  body {
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .station-container {
    width: 100%;
    max-width: 50rem;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
    align-items: center;
    box-sizing: border-box;
  }

  .station-header {
    text-align: center;
    width: 100%;
  }
  
  #timeDisplay {
    font-size: 5rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #fff;
    margin-bottom: 0.5rem;
  }
  
  #dateDisplay {
    font-size: 0.85rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #444;
  }

  /* Sleek layout container for the native forecast window */
  .widget-wrapper {
    width: 100%;
    height: 220px;
    background: #111;
    border: 1px solid #1c1c1c;
    border-radius: 8px;
    overflow: hidden;
    box-sizing: border-box;
  }

  .widget-frame {
    width: 100%;
    height: 100%;
    border: none;
  }

  .back-btn {
    margin-top: 1rem;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-decoration: none;
    color: #333;
    transition: color 0.3s;
  }
  .back-btn:hover { color: #666; }
</style>
</head>
<body>

<div class="station-container">
  
  <header class="station-header">
    <div id="timeDisplay">12:00:00</div>
    <div id="dateDisplay">LOADING RUNTIME...</div>
  </header>

  <div class="widget-wrapper">
    <iframe class="widget-frame" src="https://embed.windy.com/embed.html?type=forecast&detailLat=39.643&detailLon=-84.287&detail=true&metricTemp=default&metricRain=default&metricWind=default"></iframe>
  </div>

  <a href="./" class="back-btn">← RETURN TO SYSTEM</a>

</div>

<script>
  // ── LIVE RUNTIME CLOCK SYSTEM ───────────────────────────
  function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();
    
    // Convert to standard 12-hour format
    hours = hours % 12;
    hours = hours ? hours : 12; 
    
    minutes = minutes < 10 ? "0" + minutes : minutes;
    seconds = seconds < 10 ? "0" + seconds : seconds;
    
    document.getElementById("timeDisplay").textContent = `${hours}:${minutes}:${seconds}`;

    const options = { weekday: "long", month: "short", day: "numeric", year: "numeric" };
    document.getElementById("dateDisplay").textContent = now.toLocaleDateString("en-US", options).toUpperCase();
  }
  
  // Fire instantly, then trigger the 1-second update interval loop
  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
