<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<title>Ambient Command Center</title>

  body {
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
  }

  .matrix-container {
    width: 100%;
    max-width: 75rem;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 3rem;
  }

  /* ── TOP SECTION: CENTERED TIME & DATE ── */
  .clock-box {
    text-align: center;
    width: 100%;
  }
  
  #timeDisplay {
    font-size: 6rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #fff;
    margin-bottom: 0.5rem;
  }
  
  #dateDisplay {
    font-size: 0.95rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #444;
  }

  /* ── MAIN DECK: SIDE-BY-SIDE SPLIT ── */
  .main-deck {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
    align-items: flex-start;
  }
