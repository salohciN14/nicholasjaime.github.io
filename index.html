<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nicholas Jaime</title>
  <link rel="icon" type="image/png" href="../Logo1.png?v=2">
<meta name="description" content="The personal site of Nicholas Jaime.">

<style>
  html, body { height: 100%; overflow: hidden; }

  .hero {
    position: relative;
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background-image: url('PR Sunset.jpg');
    background-size: cover;
    background-position: center;
    filter: brightness(0.38);
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .hero-bg.loaded { opacity: 1; }

  .hero-gradient-tb {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent 40%, rgba(0,0,0,0.7));
    pointer-events: none;
  }
  .hero-gradient-lr {
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.2), transparent, rgba(0,0,0,0.2));
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 0 1.5rem;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 1.2s ease 0.3s, transform 1.2s ease 0.3s;
  }
  .hero-content.loaded { opacity: 1; transform: translateY(0); }

  .hero-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(4rem, 12vw, 9rem);
    font-weight: 300;
    color: var(--text-primary);
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .hero-name em { font-style: italic; }

  .hero-nav {
    margin-top: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
  }

  .hero-nav-divider {
    width: 1px;
    height: 0.75rem;
    background: var(--text-muted);
    opacity: 0.4;
  }

  /* ── NAME COLLECTOR MODAL STYLES ── */
  .name-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(6px);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .name-modal.active {
    opacity: 1;
    pointer-events: all;
  }
  .name-modal-box {
    background: #111;
    border: 1px solid #333;
    padding: 2.5rem;
    max-width: 400px;
    width: 90%;
    text-align: center;
    color: #fff;
    border-radius: 12px;
  }
  .name-modal-box h3 {
    font-size: 1.5rem;
    font-weight: 400;
    margin-bottom: 0.75rem;
  }
  .name-modal-box p {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 1.25rem;
    line-height: 1.4;
  }
  .disclaimer-text {
    font-size: 0.68rem !important;
    color: #555 !important;
    background: #161616;
    padding: 0.5rem;
    border-radius: 4px;
    margin-bottom: 1.2rem !important;
    border: 1px solid #222;
    text-align: left;
    line-height: 1.3;
  }
  .name-modal-box input {
    width: 100%;
    padding: 0.75rem;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #fff;
    font-size: 0.9rem;
    margin-bottom: 1rem;
    text-align: center;
    outline: none;
    box-sizing: border-box;
    border-radius: 6px;
  }
  .name-modal-box input:focus {
    border-color: #666;
  }
  .name-modal-box button {
    width: 100%;
    padding: 0.75rem;
    background: #fff;
    color: #000;
    border: none;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.3s;
    border-radius: 6px;
  }
  .name-modal-box button:hover {
    background: #ccc;
  }
  .skip-btn {
    background: transparent !important;
    color: #666 !important;
    margin-top: 0.5rem;
    letter-spacing: 0.1em !important;
  }
  .skip-btn:hover {
    color: #fff !important;
  }
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <section class="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-gradient-tb"></div>
    <div class="hero-gradient-lr"></div>

    <div class="hero-content" id="heroContent">
      <h1 class="hero-name">Nicholas<br><em>Jaime</em></h1>
      <nav class="hero-nav">
        <a href="gallery/" class="nav-link">Gallery</a>
        <div class="hero-nav-divider"></div>
        <a href="contact/" class="nav-link">Contact</a>
      </nav>
    </div>
  </section>

  <!-- Visitor Name Collector Modal -->
  <div class="name-modal" id="nameModal">
    <div class="name-modal-box">
      <h3>Welcome</h3>
      <p>Before you look around, please enter your name.</p>
      
      <div class="disclaimer-text">
        Notice: Basic device metrics, rough location data, and your IP address will be logged upon submission.
      </div>

      <form id="nameForm">
        <input type="text" id="visitorName" placeholder="Your Name" required autocomplete="name">
        <button type="submit">Submit & Enter</button>
        <button type="button" class="skip-btn" id="skipModal">Skip</button>
      </form>
    </div>
  </div>

<script>
  const bg = document.getElementById('heroBg');
  const content = document.getElementById('heroContent');
  const img = new Image();

  img.src = 'PR Sunset.jpg';
  img.onload = () => { 
    bg.classList.add('loaded'); 
    content.classList.add('loaded'); 
  };
</script>

<!-- Include EmailJS SDK -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
  // Initialize EmailJS with your Public Key
  emailjs.init("gnfoSfHXnbnYsnWdn");

  const modal = document.getElementById('nameModal');
  const form = document.getElementById('nameForm');
  const skipBtn = document.getElementById('skipModal');

  if (!localStorage.getItem('visitor_logged')) {
    setTimeout(() => {
      modal.classList.add('active');
    }, 1000);
  }

  function getDeviceInfo() {
    const ua = navigator.userAgent;
    let os = "Unknown OS";
    let browser = "Unknown Browser";

    if (ua.indexOf("Win") !== -1) os = "Windows";
    else if (ua.indexOf("Mac") !== -1) os = "MacOS/iOS";
    else if (ua.indexOf("Linux") !== -1) os = "Linux";
    else if (ua.indexOf("Android") !== -1) os = "Android";
    else if (ua.indexOf("like Mac") !== -1) os = "iOS";

    if (ua.indexOf("Firefox") !== -1) browser = "Mozilla Firefox";
    else if (ua.indexOf("Edge") !== -1) browser = "Microsoft Edge";
    else if (ua.indexOf("Chrome") !== -1) browser = "Google Chrome";
    else if (ua.indexOf("Safari") !== -1) browser = "Apple Safari";

    return `${os} / ${browser}`;
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const name = document.getElementById('visitorName').value;
    const deviceInfo = getDeviceInfo();
    const time = new Date().toLocaleString();
    const page = window.location.href;

    let ipAddress = "Unknown IP";
    let locationInfo = "Unknown Location";

    try {
      const response = await fetch('https://ipapi.co/json/');
      const data = await response.json();
      if (data) {
        ipAddress = data.ip || "Unknown IP";
        locationInfo = `${data.city || ""}, ${data.region || ""}, ${data.country_name || ""} (ISP: ${data.org || "Unknown"})`;
      }
    } catch (err) {
      console.log("Could not fetch IP data", err);
    }

    // Send data using your active Service ID and Template ID
    emailjs.send("service_alh3acq", "template_y4veb4n", {
      visitor_name: name,
      visitor_ip: ipAddress,
      visitor_location: locationInfo,
      visitor_device: deviceInfo,
      time: time,
      page: page
    }).then(() => {
      localStorage.setItem('visitor_logged', 'true');
      modal.classList.remove('active');
    }, (error) => {
      console.log('Failed...', error);
      modal.classList.remove('active');
    });
  });

  skipBtn.addEventListener('click', () => {
    localStorage.setItem('visitor_logged', 'skipped');
    modal.classList.remove('active');
  });
</script>
</body>
</html>
