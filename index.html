<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nicholas Jaime</title>

<meta name="description" content="The personal site of Nicholas Jaime.">

<style>
  html, body { 
    height: 100%; 
    margin: 0;
    padding: 0;
    background-color: #0a0a0a;
    color: var(--text-primary, #fff);
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP HEADER MATCHING CONTACT / GALLERY PAGES ── */
  .site-header {
    background: #0a0a0a;
    border-bottom: 1px solid var(--border-subtle, rgba(255,255,255,0.08));
    padding: 1.25rem 1.5rem;
  }

  .site-header-inner {
    max-width: 48rem;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .site-header-logo {
    display: flex;
    align-items: center;
    text-decoration: none;
    color: var(--text-primary, #fff);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-style: italic;
    font-weight: 300;
  }

  .site-header-logo img {
    width: 28px;
    height: 28px;
    display: inline-block;
    vertical-align: middle;
    margin-right: 12px;
  }

  .site-header-label {
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--text-secondary, #888);
  }

  /* ── SHORT, ZOOMED-IN HERO BANNER ── */
  .hero-banner {
    position: relative;
    width: 100%;
    height: 220px; /* Short vertical height */
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background-image: url('PR Sunset.jpg');
    background-size: 150%; /* Zooms in on the image to make it less tall */
    background-position: center 45%; /* Centers the zoomed focus */
    background-repeat: no-repeat;
    filter: brightness(0.38);
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .hero-bg.loaded { opacity: 1; }

  .hero-gradient-tb {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent 40%, rgba(0,0,0,0.7));
    pointer-events: none;
  }
  .hero-gradient-lr {
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.2), transparent, rgba(0,0,0,0.2));
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 0 1.5rem;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 1.2s ease 0.3s, transform 1.2s ease 0.3s;
  }
  .hero-content.loaded { opacity: 1; transform: translateY(0); }

  .hero-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.8rem, 7vw, 4.5rem);
    font-weight: 300;
    color: var(--text-primary, #fff);
    line-height: 1;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .hero-name em { font-style: italic; }

  /* ── BLACK LOWER AREA (ATTACHED DIRECTLY BELOW IMAGE) ── */
  .main-lower {
    flex: 1;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 2rem; /* Tight spacing directly under bottom edge of photo */
    padding-bottom: 2rem;
  }

  .hero-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    margin-bottom: 3rem;
  }

  .hero-nav a {
    color: var(--text-secondary, #aaa);
    text-decoration: none;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 500;
    transition: color 0.3s;
  }

  .hero-nav a:hover {
    color: var(--text-primary, #fff);
  }

  .hero-nav-divider {
    width: 1px;
    height: 0.75rem;
    background: var(--text-muted, #555);
    opacity: 0.4;
  }

  .page-footer-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 48rem;
    border-top: 1px solid var(--border-subtle, rgba(255,255,255,0.08));
    padding-top: 1.5rem;
    padding-left: 1.5rem;
    padding-right: 1.5rem;
    box-sizing: border-box;
    margin-top: auto;
  }

  .page-footer-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    font-weight: 300;
    font-style: italic;
    color: var(--text-muted, #777);
  }

  .page-footer-copy {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted, #777);
  }

  /* ── NAME COLLECTOR MODAL STYLES (STRICT LOCK) ── */
  .name-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .name-modal.active {
    opacity: 1;
    pointer-events: all;
  }
  .name-modal-box {
    background: #111;
    border: 1px solid #333;
    padding: 2.5rem;
    max-width: 400px;
    width: 90%;
    text-align: center;
    color: #fff;
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.7);
  }
  .name-modal-box h3 {
    font-size: 1.5rem;
    font-weight: 400;
    margin-bottom: 0.5rem;
  }
  .modal-status {
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-secondary, #aaa);
    opacity: 0.7;
    margin-bottom: 1.25rem;
  }
  .name-modal-box p {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 1.25rem;
    line-height: 1.4;
  }
  .name-modal-box input {
    width: 100%;
    padding: 0.75rem;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #fff;
    font-size: 0.9rem;
    margin-bottom: 1rem;
    text-align: center;
    outline: none;
    box-sizing: border-box;
    border-radius: 6px;
  }
  .name-modal-box input:focus {
    border-color: #666;
  }
  .name-modal-box button {
    width: 100%;
    padding: 0.75rem;
    background: #fff;
    color: #000;
    border: none;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.3s;
    border-radius: 6px;
  }
  .name-modal-box button:hover {
    background: #ccc;
  }
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>

</head>
<body>

  <div class="page">
    <!-- Top Header matching Contact and Gallery pages -->
    <header class="site-header">
      <div class="site-header-inner">
        <a href="../" class="site-header-logo">
          <img src="../Logo1.png" alt="Home">
          Nicholas Jaime
        </a>
        <span class="site-header-label">Home</span>
      </div>
    </header>

    <!-- Zoomed-In Short Hero Sunset Banner -->
    <section class="hero-banner">
      <div class="hero-bg" id="heroBg"></div>
      <div class="hero-gradient-tb"></div>
      <div class="hero-gradient-lr"></div>

      <div class="hero-content" id="heroContent">
        <h1 class="hero-name">Nicholas<br><em>Jaime</em></h1>
      </div>
    </section>

    <!-- Lower Black Background Area (Immediately below the cropped image) -->
    <div class="main-lower">
      <nav class="hero-nav">
        <a href="gallery/" class="nav-link">Gallery</a>
        <div class="hero-nav-divider"></div>
        <a href="contact/" class="nav-link">Contact</a>
      </nav>

      <div class="page-footer-bottom">
        <span class="page-footer-name">Nicholas Jaime</span>
        <span class="page-footer-copy">© 2026 — All Rights Reserved</span>
      </div>
    </div>
  </div>

  <!-- Visitor Name Collector Modal (Strictly locks site until name is entered) -->
  <div class="name-modal" id="nameModal">
    <div class="name-modal-box">
      <h3>Welcome</h3>
      <p class="modal-status">Features in Testing</p>
      <p>Please enter your name to access the website. This feature is currently being tested.</p>

      <form id="nameForm">
        <input type="text" id="visitorName" placeholder="Your Name" required autocomplete="name">
        <button type="submit">Submit & Enter</button>
      </form>
    </div>
  </div>

<script>
  const bg = document.getElementById('heroBg');
  const content = document.getElementById('heroContent');
  const img = new Image();

  img.src = 'PR Sunset.jpg';
  img.onload = () => { 
    bg.classList.add('loaded'); 
    content.classList.add('loaded'); 
  };
</script>

<!-- Include EmailJS SDK -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
  emailjs.init("gnfoSfHXnbnYsnWdn");

  const modal = document.getElementById('nameModal');
  const form = document.getElementById('nameForm');

  // Check if visitor has logged their name before; if not, force modal open immediately with no skip option
  if (!localStorage.getItem('visitor_logged')) {
    modal.classList.add('active');
  }

  function getDeviceInfo() {
    const ua = navigator.userAgent;
    let os = "Unknown OS";
    let browser = "Unknown Browser";

    if (ua.indexOf("Win") !== -1) os = "Windows";
    else if (ua.indexOf("Mac") !== -1) os = "MacOS/iOS";
    else if (ua.indexOf("Linux") !== -1) os = "Linux";
    else if (ua.indexOf("Android") !== -1) os = "Android";
    else if (ua.indexOf("like Mac") !== -1) os = "iOS";

    if (ua.indexOf("Firefox") !== -1) browser = "Mozilla Firefox";
    else if (ua.indexOf("Edge") !== -1) browser = "Microsoft Edge";
    else if (ua.indexOf("Chrome") !== -1) browser = "Google Chrome";
    else if (ua.indexOf("Safari") !== -1) browser = "Apple Safari";

    return `${os} / ${browser}`;
  }

  async function fetchLocationData() {
    return new Promise((resolve) => {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const mapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;

            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
              const data = await res.json();
              if (data && data.address) {
                const town = data.address.city || data.address.town || data.address.village || data.address.suburb || "Unknown Town";
                const state = data.address.state || "";
                resolve({
                  location: `${town}, ${state} (Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)})`,
                  map_url: mapsUrl,
                  ip: "Hidden/GPS Mode"
                });
                return;
              }
            } catch (e) {}

            resolve({
              location: `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)} (GPS Precise)`,
              map_url: mapsUrl,
              ip: "Hidden/GPS Mode"
            });
          },
          async () => {
            try {
              const res = await fetch('https://ipapi.co/json/');
              const data = await res.json();
              resolve({
                location: `${data.city || ""}, ${data.region || ""}, ${data.country_name || ""} (IP Fallback)`,
                map_url: `https://www.google.com/maps?q=${data.latitude || 0},${data.longitude || 0}`,
                ip: data.ip || "Unknown IP"
              });
            } catch (err) {
              resolve({ location: "Unknown Location", map_url: "#", ip: "Unknown IP" });
            }
          },
          { timeout: 5000 }
        );
      } else {
        fetch('https://ipapi.co/json/')
          .then(res => res.json())
          .then(data => {
            resolve({
              location: `${data.city || ""}, ${data.region || ""}, ${data.country_name || ""} (IP Fallback)`,
              map_url: `https://www.google.com/maps?q=${data.latitude || 0},${data.longitude || 0}`,
              ip: data.ip || "Unknown IP"
            });
          })
          .catch(() => resolve({ location: "Unknown Location", map_url: "#", ip: "Unknown IP" }));
      }
    });
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const name = document.getElementById('visitorName').value;
    const deviceInfo = getDeviceInfo();
    const time = new Date().toLocaleString();
    const page = window.location.href;

    const locData = await fetchLocationData();

    emailjs.send("service_alh3acq", "template_y4veb4n", {
      visitor_name: name,
      visitor_ip: locData.ip,
      visitor_location: locData.location,
      map_url: locData.map_url,
      visitor_device: deviceInfo,
      time: time,
      page: page
    }).then(() => {
      localStorage.setItem('visitor_logged', 'true');
      modal.classList.remove('active');
    }, (error) => {
      console.log('Failed...', error);
      modal.classList.remove('active');
    });
  });
</script>
</body>
</html>
