<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nicholas Jaime</title>
<link rel="icon" type="image/png" href="../Logo1.png">
<meta name="description" content="Personal portfolio of Nicholas Jaime.">
<link rel="stylesheet" href="css/style.css">
<style>
  html, body { height: 100%; overflow: hidden; }

  .hero {
    position: relative;
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background-image: url('PR Sunset.jpg');
    background-size: cover;
    background-position: center;
    filter: brightness(0.38);
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .hero-bg.loaded { opacity: 1; }

  .hero-gradient-tb {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent 40%, rgba(0,0,0,0.7));
    pointer-events: none;
  }
  .hero-gradient-lr {
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.2), transparent, rgba(0,0,0,0.2));
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 0 1.5rem;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 1.2s ease 0.3s, transform 1.2s ease 0.3s;
  }
  .hero-content.loaded { opacity: 1; transform: translateY(0); }

  .hero-eyebrow {
    font-size: 0.6rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 1rem;
    font-weight: 300;
  }

  .hero-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(4rem, 12vw, 9rem);
    font-weight: 300;
    color: var(--text-primary);
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .hero-name em { font-style: italic; }

  .hero-nav {
    margin-top: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
  }

  .hero-nav-divider {
    width: 1px;
    height: 0.75rem;
    background: var(--text-muted);
    opacity: 0.4;
  }

  .scroll-hint {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    opacity: 1;
    transition: opacity 0.6s ease;
  }
  .scroll-hint.hidden { opacity: 0; }
  .scroll-hint span {
    font-size: 0.55rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .scroll-hint svg {
    animation: bounce 2s infinite;
    color: var(--text-muted);
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(4px); }
  }
</style>
</head>
<body>
  <section class="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-gradient-tb"></div>
    <div class="hero-gradient-lr"></div>

    <div class="hero-content" id="heroContent">
      <h1 class="hero-name">Nicholas<br><em>Jaime</em></h1>
      <nav class="hero-nav">
        <a href="gallery/index.html" class="nav-link">Gallery</a>
        <div class="hero-nav-divider"></div>
        <a href="contact/index.html" class="nav-link">Contact</a>
      </nav>
    </div>

  </section>

<script>
  const bg = document.getElementById('heroBg');
  const content = document.getElementById('heroContent');
  const hint = document.getElementById('scrollHint');
  const img = new Image();
  img.src = bg.style.backgroundImage.replace(/url\(['"]?|['"]?\)/g, '') || 'https://images.pexels.com/photos/1761279/pexels-photo-1761279.jpeg?auto=compress&cs=tinysrgb&w=1920';
  img.onload = () => { bg.classList.add('loaded'); content.classList.add('loaded'); };

  window.addEventListener('scroll', () => {
    if (window.scrollY > 20) hint.classList.add('hidden');
    else hint.classList.remove('hidden');
  }, { passive: true });
</script>
</body>
</html>
