<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nicholas Jaime</title>
  <link rel="icon" type="image/png" href="../Logo1.png?v=2">
<meta name="description" content="The personal site of Nicholas Jaime.">
<link rel="stylesheet" href="css/style.css">
<style>
  html, body { height: 100%; overflow: hidden; }

  .hero {
    position: relative;
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background-image: url('PR Sunset.jpg');
    background-size: cover;
    background-position: center;
    filter: brightness(0.38);
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .hero-bg.loaded { opacity: 1; }

  .hero-gradient-tb {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent 40%, rgba(0,0,0,0.7));
    pointer-events: none;
  }
  .hero-gradient-lr {
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.2), transparent, rgba(0,0,0,0.2));
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 0 1.5rem;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 1.2s ease 0.3s, transform 1.2s ease 0.3s;
  }
  .hero-content.loaded { opacity: 1; transform: translateY(0); }

  .hero-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(4rem, 12vw, 9rem);
    font-weight: 300;
    color: var(--text-primary);
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .hero-name em { font-style: italic; }

  .hero-nav {
    margin-top: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
  }

  .hero-nav-divider {
    width: 1px;
    height: 0.75rem;
    background: var(--text-muted);
    opacity: 0.4;
  }
</style>
</head>
<body>
  <section class="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-gradient-tb"></div>
    <div class="hero-gradient-lr"></div>

    <div class="hero-content" id="heroContent">
      <h1 class="hero-name">Nicholas<br><em>Jaime</em></h1>
      <nav class="hero-nav">
        <a href="gallery/" class="nav-link">Gallery</a>
        <div class="hero-nav-divider"></div>
        <a href="contact/" class="nav-link">Contact</a>
      </nav>
    </div>

  </section>

<script>
  const bg = document.getElementById('heroBg');
  const content = document.getElementById('heroContent');
  const img = new Image();
  
  img.src = 'PR Sunset.jpg';
  img.onload = () => { 
    bg.classList.add('loaded'); 
    content.classList.add('loaded'); 
  };
</script>
</body>
</html>
