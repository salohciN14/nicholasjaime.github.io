<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Nicholas Jaime</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .page { min-height: 100vh; padding-bottom: 6rem; }

  /* Section headers */
  .gallery-header {
    max-width: 48rem;
    margin: 0 auto;
    padding: 5rem 1.5rem 1rem;
  }
  .gallery-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 300;
    font-style: italic;
    color: var(--text-primary);
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .section-wrap {
    max-width: 48rem;
    margin: 0 auto;
    padding: 3rem 1.5rem 0;
  }

  .section-title {
    font-size: 0.6rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Carousel box */
  .carousel {
    position: relative;
    background: #111;
    overflow: hidden;
    aspect-ratio: 3/2;
    margin-bottom: 0.5rem;
  }

  .carousel-track {
    display: flex;
    height: 100%;
    transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  .carousel-slide {
    min-width: 100%;
    height: 100%;
    position: relative;
    cursor: zoom-in;
  }

  .carousel-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    transition: filter 0.4s ease;
  }
  .carousel-slide:hover img { filter: brightness(1.05); }

  /* Carousel arrows */
  .carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    background: rgba(0,0,0,0.5);
    border: none;
    color: #fff;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 1rem;
    transition: background 0.3s;
    backdrop-filter: blur(4px);
  }
  .carousel-btn:hover { background: rgba(0,0,0,0.8); }
  .carousel-btn.prev { left: 0.75rem; }
  .carousel-btn.next { right: 0.75rem; }
  .carousel-btn:disabled { opacity: 0.2; cursor: default; }

  /* Dots */
  .carousel-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 0.6rem 0 1.5rem;
  }
  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
    cursor: pointer;
    transition: background 0.3s, transform 0.3s;
  }
  .dot.active { background: var(--text-primary); transform: scale(1.3); }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.97);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .lightbox.open { opacity: 1; pointer-events: all; }

  .lightbox img {
    max-width: 90vw;
    max-height: 88vh;
    object-fit: contain;
    transform: scale(0.96);
    transition: transform 0.4s ease;
  }
  .lightbox.open img { transform: scale(1); }

  .lightbox-close {
    position: absolute;
    top: 1.5rem; right: 1.5rem;
    background: none; border: none;
    color: var(--text-muted);
    font-size: 1.5rem;
    cursor: pointer;
    line-height: 1;
    transition: color 0.3s;
    font-family: sans-serif;
  }
  .lightbox-close:hover { color: #fff; }

  .lightbox-btn {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.08);
    border: none; color: #fff;
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.2rem;
    transition: background 0.3s;
  }
  .lightbox-btn:hover { background: rgba(255,255,255,0.15); }
  .lightbox-btn.prev { left: 1rem; }
  .lightbox-btn.next { right: 1rem; }

  .lightbox-counter {
    position: absolute;
    bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* Footer nav */
  .footer-nav {
    max-width: 48rem;
    margin: 4rem auto 0;
    padding: 2rem 1.5rem 0;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    justify-content: space-between;
  }
  .footer-nav a {
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-secondary);
    transition: color 0.3s;
  }
  .footer-nav a:hover { color: var(--text-primary); }
</style>

  <p class="lightbox-counter" id="lbCounter"></p>

<script>
// ── Carousel setup ────────────────────────────
document.querySelectorAll('[data-carousel]').forEach(carousel => {
  const track = carousel.querySelector('.carousel-track');
  const slides = carousel.querySelectorAll('.carousel-slide');
  const prevBtn = carousel.querySelector('.carousel-btn.prev');
  const nextBtn = carousel.querySelector('.carousel-btn.next');
  const dotsWrap = carousel.nextElementSibling;
  let current = 0;

  // Build dots
  slides.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(dot);
  });

  function goTo(n) {
    current = Math.max(0, Math.min(slides.length - 1, n));
    track.style.transform = `translateX(-${current * 100}%)`;
    dotsWrap.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === slides.length - 1;
  }

  prevBtn.addEventListener('click', () => goTo(current - 1));
  nextBtn.addEventListener('click', () => goTo(current + 1));

  // Click to open lightbox
  slides.forEach((slide, i) => {
    slide.addEventListener('click', () => {
      const imgs = [...slides].map(s => s.querySelector('img'));
      openLightbox(imgs, i);
    });
  });

  goTo(0);
});

// ── Lightbox ──────────────────────────────────
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbCounter = document.getElementById('lbCounter');
let lbImages = [], lbIndex = 0;

function openLightbox(imgs, index) {
  lbImages = imgs;
  lbIndex = index;
  renderLightbox();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderLightbox() {
  lbImg.src = lbImages[lbIndex].src;
  lbCounter.textContent = `${lbIndex + 1} / ${lbImages.length}`;
  document.getElementById('lbPrev').disabled = lbIndex === 0;
  document.getElementById('lbNext').disabled = lbIndex === lbImages.length - 1;
}

function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', () => { lbIndex--; renderLightbox(); });
document.getElementById('lbNext').addEventListener('click', () => { lbIndex++; renderLightbox(); });
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft' && lbIndex > 0) { lbIndex--; renderLightbox(); }
  if (e.key === 'ArrowRight' && lbIndex < lbImages.length - 1) { lbIndex++; renderLightbox(); }
});
</script>
