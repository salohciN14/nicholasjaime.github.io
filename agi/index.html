<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Core Dashboard</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-blue: #58a6ff;
            --accent-green: #238636;
            --accent-green-hover: #2ea043;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --offline-color: #da3633;
            --online-color: #2ea043;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1.2fr 0.8fr;
            }
            .full-width {
                grid-column: 1 / -1;
            }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        header h1 {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--offline-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--offline-color);
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .status-dot.online {
            background-color: var(--online-color);
            box-shadow: 0 0 8px var(--online-color);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            width: 100%;
            height: 95px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            padding: 12px;
            font-size: 1rem;
            resize: none;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        button.btn-submit {
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            min-height: 48px;
            transition: background-color 0.2s;
        }

        button.btn-submit:active {
            background-color: var(--accent-green-hover);
        }

        .ai-response {
            background-color: rgba(88, 166, 255, 0.08);
            border: 1px solid rgba(88, 166, 255, 0.3);
            border-radius: 6px;
            padding: 12px;
            font-size: 0.9rem;
            color: var(--accent-blue);
            display: none;
        }

        .list-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .empty-state {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
            padding: 8px 0;
        }

        .stat-highlight {
            font-size: 0.9rem;
            color: var(--text-main);
            background-color: var(--bg-color);
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid var(--border-color);
        }

        .news-item {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="full-width">
            <h1>System Dashboard</h1>
            <div class="status-badge">
                <div id="statusDot" class="status-dot"></div>
                <span id="statusText">Offline</span>
            </div>
        </header>

        <div style="display: flex; flex-direction: column; gap: 16px;">
            <div class="card">
                <div class="card-title">End-of-Day Input</div>
                <textarea id="dumpInput" placeholder="Type here..."></textarea>
                <button class="btn-submit" onclick="handleDump()">Submit to AI Engine</button>
                
                <div id="aiResponseCard" class="ai-response">
                    <strong>AI Status:</strong> <span id="aiResponseText"></span>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <span>Pending Assignments</span>
                    <span id="taskCount" style="color: var(--text-muted);">0</span>
                </div>
                <div class="list-group" id="taskList">
                    <div class="empty-state">No active assignments.</div>
                </div>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px;">
            <div class="card">
                <div class="card-title">Gym & Recovery Log</div>
                <div class="stat-highlight" id="latestWorkout">
                    No workouts logged.
                </div>
                <div class="news-item" id="workoutRec">
                    Recommendation pending workout data.
                </div>
            </div>

            <div class="card">
                <div class="card-title">GSMArena Radar</div>
                <div class="news-item" id="techNewsFeed">
                    Feed idle.
                </div>
            </div>
        </div>
    </div>

    <script>
        // Exact URL of your Vercel Serverless API from your screenshot
        const API_URL = 'https://nicholasjaime-github-io.vercel.app/api/parse';

        window.addEventListener('DOMContentLoaded', checkBackendStatus);

        async function checkBackendStatus() {
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            try {
                const res = await fetch(API_URL, { method: 'OPTIONS' });
                if (res.ok) {
                    dot.classList.add('online');
                    statusText.innerText = "Engine Active";
                } else {
                    throw new Error();
                }
            } catch (e) {
                dot.classList.remove('online');
                statusText.innerText = "Offline";
            }
        }

        async function handleDump() {
            const inputField = document.getElementById('dumpInput');
            const input = inputField.value.trim();
            if (!input) {
                alert("Please type something into the box first!");
                return;
            }

            const responseCard = document.getElementById('aiResponseCard');
            const responseText = document.getElementById('aiResponseText');
            
            responseCard.style.display = 'block';
            responseText.innerText = "Processing with Gemini...";

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: input })
                });

                const json = await res.json();

                if (!json.success) {
                    throw new Error(json.error || 'Server error');
                }

                const data = json.data;

                responseText.innerText = data.aiSummary || "Processed successfully.";

                const taskList = document.getElementById('taskList');
                const taskCount = document.getElementById('taskCount');
                if (data.assignments && data.assignments.length > 0) {
                    taskList.innerHTML = data.assignments.map(a => `<div class="stat-highlight">• ${a}</div>`).join('');
                    taskCount.innerText = data.assignments.length;
                }

                if (data.workouts) {
                    document.getElementById('latestWorkout').innerText = data.workouts;
                }

                inputField.value = '';

            } catch (err) {
                responseText.innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
