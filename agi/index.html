<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGI Control Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --border-color: #334155;
            --urgent-color: #ef4444;
            --upcoming-color: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            height: 90vh;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
        }

        .stoplight {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #64748b;
        }

        .stoplight.active {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .stoplight.offline {
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
            margin-bottom: 15px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            line-height: 1.4;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--accent-color);
            color: white;
        }

        .message.ai {
            align-self: flex-start;
            background-color: var(--border-color);
            color: var(--text-color);
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 6px;
            outline: none;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .task-section {
            margin-bottom: 20px;
        }

        .task-section h3 {
            margin-top: 0;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-section.urgent h3 { color: var(--urgent-color); }
        .task-section.upcoming h3 { color: var(--upcoming-color); }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-item button {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 0 5px;
        }

        .task-item button:hover {
            color: var(--urgent-color);
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="panel">
        <div class="header">
            <h2>AGI Core</h2>
            <div class="status-container">
                <div id="stoplight" class="stoplight"></div>
                <span id="status-text">Connecting...</span>
            </div>
        </div>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type or dictate tasks/messages..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <div class="panel">
        <div class="header">
            <h2>Task Center</h2>
        </div>
        
        <div class="task-section urgent">
            <h3>🔴 Urgent / High Priority</h3>
            <ul id="urgent-tasks" class="task-list"></ul>
        </div>

        <div class="task-section upcoming">
            <h3>🟡 Upcoming</h3>
            <ul id="upcoming-tasks" class="task-list"></ul>
        </div>
    </div>
</div>

<script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://bjjzgjrbdulmnxfchwzr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6ZNTevqND_KK8rzNBY6IPA_5_MqTBnX';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const stoplight = document.getElementById('stoplight');
    const statusText = document.getElementById('status-text');
    const chatBox = document.getElementById('chat-box');

    // Startup & Health Check
    window.addEventListener('DOMContentLoaded', async () => {
        checkBackendHealth();
        await loadSavedData();
    });

    async function checkBackendHealth() {
        try {
            const res = await fetch('/api/parse');
            if (res.ok) {
                stoplight.className = 'stoplight active';
                statusText.innerText = 'Engine Active';
            } else {
                throw new Error();
            }
        } catch {
            stoplight.className = 'stoplight offline';
            statusText.innerText = 'Offline';
        }
    }

    // Load persisted chat history and tasks from Supabase
    async function loadSavedData() {
        // Fetch Chat
        const { data: messages } = await supabase
            .from('chat_messages')
            .select('*')
            .order('created_at', { ascending: true });

        chatBox.innerHTML = '';
        if (messages && messages.length > 0) {
            messages.forEach(msg => appendMessageUI(msg.sender, msg.content));
        }

        // Fetch Tasks
        refreshTasksUI();
    }

    async function refreshTasksUI() {
        const { data: urgent } = await supabase
            .from('tasks')
            .select('*')
            .eq('category', 'urgent')
            .eq('completed', false);

        const { data: upcoming } = await supabase
            .from('tasks')
            .select('*')
            .eq('category', 'upcoming')
            .eq('completed', false);

        renderTaskList('urgent-tasks', urgent || []);
        renderTaskList('upcoming-tasks', upcoming || []);
    }

    function renderTaskList(elementId, tasks) {
        const ul = document.getElementById(elementId);
        ul.innerHTML = '';
        tasks.forEach(t => {
            const li = document.createElement('li');
            li.className = 'task-item';
            li.innerHTML = `
                <span>${t.task_text}</span>
                <button onclick="completeTask(${t.id})">✓</button>
            `;
            ul.appendChild(li);
        });
    }

    function appendMessageUI(sender, content) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = content;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function completeTask(id) {
        await supabase.from('tasks').update({ completed: true }).eq('id', id);
        refreshTasksUI();
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        appendMessageUI('user', text);

        // Save User Message to DB
        await supabase.from('chat_messages').insert([{ sender: 'user', content: text }]);

        try {
            const response = await fetch('/api/parse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });

            const result = await response.json();

            if (result.success && result.data) {
                const { reply, urgentTasks, upcomingTasks } = result.data;

                // Render & Save AI Reply
                appendMessageUI('ai', reply);
                await supabase.from('chat_messages').insert([{ sender: 'ai', content: reply }]);

                // Save Urgent Tasks
                if (urgentTasks && urgentTasks.length > 0) {
                    for (const task of urgentTasks) {
                        await supabase.from('tasks').insert([{ task_text: task, category: 'urgent' }]);
                    }
                }

                // Save Upcoming Tasks
                if (upcomingTasks && upcomingTasks.length > 0) {
                    for (const task of upcomingTasks) {
                        await supabase.from('tasks').insert([{ task_text: task, category: 'upcoming' }]);
                    }
                }

                refreshTasksUI();
            } else {
                appendMessageUI('ai', 'Error processing request.');
            }
        } catch (err) {
            console.error(err);
            appendMessageUI('ai', 'Failed to connect to AGI engine.');
        }
    }
</script>
</body>
</html>
