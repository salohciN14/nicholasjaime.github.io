<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --input-bg: #0d1117;
            --btn-green: #238636;
            --urgent-title: #f85149;
            --upcoming-title: #58a6ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-panel h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 600;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0d1117;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .lights {
            display: flex;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #30363d;
        }

        .dot.active {
            background-color: #2ea44f;
            box-shadow: 0 0 6px #2ea44f;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 520px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 1.1rem;
        }

        .chat-history {
            flex-grow: 1;
            overflow-y: auto;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .msg {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .msg.user {
            align-self: flex-end;
            background-color: #1f6feb;
            color: white;
        }

        .msg.ai {
            align-self: flex-start;
            background-color: #21262d;
            border: 1px solid var(--border-color);
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex-grow: 1;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }

        .btn-send {
            background-color: var(--btn-green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-alerts {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .task-box {
            margin-bottom: 20px;
        }

        .task-box label {
            display: block;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .task-box.urgent label { color: var(--urgent-title); }
        .task-box.upcoming label { color: var(--upcoming-title); }

        .task-container {
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            min-height: 40px;
            font-size: 0.85rem;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #21262d;
        }

        .task-item:last-child { border-bottom: none; }

        .task-item button {
            background: none;
            border: none;
            color: #8b949e;
            cursor: pointer;
        }

        .task-item button:hover { color: #f85149; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header-panel">
        <h1>AGI Dashboard</h1>
        <div class="status-badge">
            <div class="lights">
                <div class="dot"></div>
                <div class="dot"></div>
                <div id="status-dot" class="dot"></div>
            </div>
            <span id="status-text">CONNECTING...</span>
        </div>
    </div>

    <div class="main-layout">
        <div class="card">
            <div class="card-header">
                <h2>Assistant Chat</h2>
            </div>
            <div id="chat-history" class="chat-history">
                <div class="msg ai">Hello! Let me know what assignments or tasks you have, and I'll keep track of them for you.</div>
            </div>
            <div class="input-row">
                <input type="text" id="user-input" placeholder="Type a message or state an assignment..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="btn-send" onclick="sendMessage()">Send</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Pending Notifications</h2>
                <button class="btn-alerts" onclick="enableAlerts()">Enable Alerts</button>
            </div>

            <div class="task-box urgent">
                <label>URGENT TASKS (RANDOM ALERTS: 10–20M)</label>
                <div id="urgent-tasks" class="task-container">None</div>
            </div>

            <div class="task-box upcoming">
                <label>UPCOMING TASKS</label>
                <div id="upcoming-tasks" class="task-container">None</div>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://bjjzgjrbdulmnxfchwzr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6ZNTevqND_KK8rzNBY6IPA_5_MqTBnX';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const chatHistory = document.getElementById('chat-history');

    window.addEventListener('DOMContentLoaded', async () => {
        checkBackendHealth();
        await loadDataFromSupabase();
    });

    async function checkBackendHealth() {
        try {
            const res = await fetch('/api/parse');
            if (res.ok) {
                statusDot.className = 'dot active';
                statusText.innerText = 'ENGINE ACTIVE';
            } else {
                throw new Error();
            }
        } catch {
            statusDot.className = 'dot';
            statusText.innerText = 'OFFLINE';
        }
    }

    async function loadDataFromSupabase() {
        // Chat History
        const { data: messages } = await supabase.from('chat_messages').select('*').order('created_at', { ascending: true });
        if (messages && messages.length > 0) {
            chatHistory.innerHTML = '';
            messages.forEach(m => appendMsgUI(m.sender, m.content));
        }

        // Tasks
        refreshTasksUI();
    }

    async function refreshTasksUI() {
        const { data: urgent } = await supabase.from('tasks').select('*').eq('category', 'urgent').eq('completed', false);
        const { data: upcoming } = await supabase.from('tasks').select('*').eq('category', 'upcoming').eq('completed', false);

        renderTasks('urgent-tasks', urgent || []);
        renderTasks('upcoming-tasks', upcoming || []);
    }

    function renderTasks(elementId, tasks) {
        const container = document.getElementById(elementId);
        if (tasks.length === 0) {
            container.innerText = 'None';
            return;
        }
        container.innerHTML = '';
        tasks.forEach(t => {
            const div = document.createElement('div');
            div.className = 'task-item';
            div.innerHTML = `
                <span>${t.task_text}</span>
                <button onclick="deleteTask(${t.id})">✕</button>
            `;
            container.appendChild(div);
        });
    }

    function appendMsgUI(sender, text) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerText = text;
        chatHistory.appendChild(div);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    async function deleteTask(id) {
        await supabase.from('tasks').update({ completed: true }).eq('id', id);
        refreshTasksUI();
    }

    function enableAlerts() {
        if ('Notification' in window) {
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') alert('Notifications Enabled!');
            });
        }
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        appendMsgUI('user', text);
        await supabase.from('chat_messages').insert([{ sender: 'user', content: text }]);

        try {
            const res = await fetch('/api/parse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });

            const json = await res.json();
            if (json.success && json.data) {
                const { reply, urgentTasks, upcomingTasks } = json.data;

                appendMsgUI('ai', reply);
                await supabase.from('chat_messages').insert([{ sender: 'ai', content: reply }]);

                if (urgentTasks) {
                    for (const task of urgentTasks) {
                        await supabase.from('tasks').insert([{ task_text: task, category: 'urgent' }]);
                    }
                }
                if (upcomingTasks) {
                    for (const task of upcomingTasks) {
                        await supabase.from('tasks').insert([{ task_text: task, category: 'upcoming' }]);
                    }
                }
                refreshTasksUI();
            }
        } catch (err) {
            appendMsgUI('ai', 'Error reaching server.');
        }
    }
</script>
</body>
</html>
