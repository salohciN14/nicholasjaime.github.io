<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGI Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-red);
            transition: background-color 0.3s ease;
        }

        .input-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            align-self: flex-end;
        }

        button:hover {
            background: #1d4ed8;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .card h3 {
            margin-top: 0;
            font-size: 1rem;
            color: #94a3b8;
        }

        ul {
            padding-left: 20px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>AGI Dashboard</h2>
            <div class="status-container">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">Checking...</span>
            </div>
        </div>

        <div class="input-section">
            <textarea id="user-input" placeholder="Enter notes, assignments, or workout recovery info..."></textarea>
            <button onclick="submitData()">Process</button>
        </div>

        <div class="results">
            <div class="card">
                <h3>Assignments</h3>
                <ul id="assignments-list"><li>None</li></ul>
            </div>
            <div class="card">
                <h3>Workouts</h3>
                <p id="workouts-text">None</p>
            </div>
            <div class="card">
                <h3>AI Summary</h3>
                <p id="summary-text">Waiting for input...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://nicholasjaime-github-io.vercel.app/api/parse';

        // Check if backend engine is alive on load
        async function checkEngineStatus() {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            try {
                const response = await fetch(API_URL, {
                    method: 'OPTIONS'
                });

                if (response.ok) {
                    statusDot.style.backgroundColor = 'var(--accent-green)';
                    statusText.textContent = 'Engine Active';
                } else {
                    throw new Error('Engine unreachable');
                }
            } catch (err) {
                statusDot.style.backgroundColor = 'var(--accent-red)';
                statusText.textContent = 'Offline';
            }
        }

        // Send input text to Vercel Gemini parser
        async function submitData() {
            const input = document.getElementById('user-input').value;
            const summaryText = document.getElementById('summary-text');
            const assignmentsList = document.getElementById('assignments-list');
            const workoutsText = document.getElementById('workouts-text');

            if (!input.trim()) return;

            summaryText.textContent = 'Processing...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: input })
                });

                const result = await response.json();

                if (result.success) {
                    const data = result.data;
                    
                    // Render Assignments
                    assignmentsList.innerHTML = '';
                    if (data.assignments && data.assignments.length > 0) {
                        data.assignments.forEach(task => {
                            const li = document.createElement('li');
                            li.textContent = task;
                            assignmentsList.appendChild(li);
                        });
                    } else {
                        assignmentsList.innerHTML = '<li>None</li>';
                    }

                    // Render Workouts
                    workoutsText.textContent = data.workouts || 'None';

                    // Render Summary
                    summaryText.textContent = data.aiSummary || 'Done.';
                } else {
                    summaryText.textContent = 'Error processing request.';
                }
            } catch (err) {
                summaryText.textContent = 'Failed to reach API server.';
            }
        }

        // Initialize status check
        checkEngineStatus();
    </script>
</body>
</html>
