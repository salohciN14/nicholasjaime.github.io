<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGI Dashboard</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b22;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ef4444;
            transition: background-color 0.3s ease;
        }

        .input-section {
            background: #161b22;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            align-self: flex-end;
        }

        button:hover {
            background: #2ea043;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }

        .card {
            background: #161b22;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }

        .card h3 {
            margin-top: 0;
            font-size: 1rem;
            color: #8b949e;
        }

        ul {
            padding-left: 20px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>AGI Dashboard</h2>
            <div class="status-container">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">Checking...</span>
            </div>
        </div>

        <div class="input-section">
            <textarea id="user-input" placeholder="Enter notes, assignments, or workout recovery info..."></textarea>
            <button onclick="submitData()">Process</button>
        </div>

        <div class="results">
            <div class="card">
                <h3>Assignments</h3>
                <ul id="assignments-list"><li>None</li></ul>
            </div>
            <div class="card">
                <h3>Workouts</h3>
                <p id="workouts-text">None</p>
            </div>
            <div class="card">
                <h3>AI Summary</h3>
                <p id="summary-text">Waiting for input...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://nicholasjaime-github-io.vercel.app/api/parse';

        // Ping backend engine on load
        async function checkEngineStatus() {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            try {
                const response = await fetch(API_URL, { method: 'OPTIONS' });
                if (response.ok) {
                    if (statusDot) statusDot.style.backgroundColor = '#238636';
                    if (statusText) statusText.textContent = 'Engine Active';
                } else {
                    throw new Error();
                }
            } catch {
                if (statusDot) statusDot.style.backgroundColor = '#ef4444';
                if (statusText) statusText.textContent = 'Offline';
            }
        }

        // Send input text to Vercel parser
        async function submitData() {
            const input = document.getElementById('user-input').value;
            const summaryText = document.getElementById('summary-text');
            const assignmentsList = document.getElementById('assignments-list');
            const workoutsText = document.getElementById('workouts-text');

            if (!input.trim()) return;

            if (summaryText) summaryText.textContent = 'Processing...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: input })
                });

                const result = await response.json();

                if (result.success) {
                    const data = result.data;
                    
                    if (assignmentsList) {
                        assignmentsList.innerHTML = '';
                        if (data.assignments && data.assignments.length > 0) {
                            data.assignments.forEach(task => {
                                const li = document.createElement('li');
                                li.textContent = task;
                                assignmentsList.appendChild(li);
                            });
                        } else {
                            assignmentsList.innerHTML = '<li>None</li>';
                        }
                    }

                    if (workoutsText) workoutsText.textContent = data.workouts || 'None';
                    if (summaryText) summaryText.textContent = data.aiSummary || 'Done.';
                } else {
                    // Displays specific Vercel/Gemini error reason directly in the UI
                    if (summaryText) summaryText.textContent = `Error: ${result.error || 'Failed to process request.'}`;
                }
            } catch (err) {
                if (summaryText) summaryText.textContent = `Network Error: ${err.message}`;
            }
        }

        checkEngineStatus();
    </script>
</body>
</html>
